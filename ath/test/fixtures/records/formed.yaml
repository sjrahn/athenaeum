  - form: heading
    at: page=3&bbox=0.145,0.1118,0.1574,0.0119
    level: 1
    num: "1."
    text: Introduction
    scopes:
      - form: heading
        at: page=3&bbox=0.1447,0.1529,0.1443,0.0135
        level: 2
        num: "1.1."
        text: Background
        scopes:
          - form: paragraph
            at: page=3&bbox=0.1429,0.1803,0.6623,0.0537
            num: "1."
            text: This procedure provides steps to estimate the heat lost from a run of insulated pipework over a reporting period, from the measured surface temperature of the insulation and the ambient temperature of the space the run passes through.
          - form: paragraph
            at: page=3&bbox=0.1436,0.2455,0.6692,0.0336
            num: "2."
            text: It is intended for operators who report thermal losses of a distribution network against a baseline and who hold measurements at the segment level only.
          - form: paragraph
            at: page=3&bbox=0.143,0.2906,0.6964,0.0737
            num: "3."
            text: Earlier versions of this procedure treated the surface coefficient as a single default. Since version 02.0 the radiative part is calculated from the emissivity of the cladding, which matters for bright metal cladding in cold spaces, where the default overstated the loss by up to a fifth.
  - form: heading
    at: page=3&bbox=0.1438,0.3901,0.4468,0.0156
    level: 1
    num: "2."
    text: Scope, applicability and entry into force
    scopes:
      - form: heading
        at: page=3&bbox=0.1436,0.4311,0.2459,0.0134
        level: 2
        num: "2.1."
        text: Scope and applicability
        scopes:
          - form: paragraph
            at: page=3&bbox=0.1434,0.4585,0.7022,0.0536
            num: "4."
            text: This procedure applies to runs of pipework carrying a heated fluid where every segment is wrapped in an insulation of known thickness and conductivity, and where the surface temperature of each segment is measured at least monthly.
          - form: paragraph
            at: page=3&bbox=0.143,0.5237,0.6984,0.0336
            num: "5."
            text: The procedure does not apply to buried pipework, to segments whose insulation is wet or damaged, or to runs shorter than twenty metres in total.
          - form: paragraph
            at: page=3&bbox=0.143,0.5689,0.7055,0.0536
            num: "6."
            text: Where a run passes through more than one space, the operator shall split it at the boundary and treat each part as a run of its own, with the ambient temperature of the space it passes through. A fitting at the boundary belongs to the part upstream of it.
      - form: heading
        at: page=3&bbox=0.1436,0.641,0.1799,0.0134
        level: 2
        num: "2.2."
        text: Entry into force
        scopes:
          - form: paragraph
            at: page=3&bbox=0.1436,0.6684,0.7081,0.0335
            num: "7."
            text: The date of entry into force is the date of publication of this version by the Office. It applies to reporting periods starting on or after that date.
  - form: heading
    at: page=3&bbox=0.1439,0.7277,0.1409,0.0119
    level: 1
    num: "3."
    text: Definitions
    scopes:
      - form: paragraph
        at: page=3&bbox=0.1432,0.7618,0.7102,0.0336
        num: "8."
        text: The definitions contained in the glossary of the Office apply. A segment is a straight length of pipe between two fittings; a run is an ordered sequence of segments.
      - form: paragraph
        at: page=3&bbox=0.1433,0.807,0.7116,0.0536
        num: "9."
        text: The surface temperature of a segment is the temperature of the outer face of its insulation or cladding, measured at the middle of the segment. The ambient temperature is the air temperature of the space at mid-height, away from heat sources.
  - form: heading
    at: page=3&bbox=0.1434,0.887,0.1431,0.0112
    level: 1
    num: "4."
    text: Parameters
    scopes:
      - form: paragraph
        at: page=4&bbox=0.1447,0.1003,0.5983,0.0135
        num: "10."
        text: "This procedure provides steps to determine the following parameters:"
      - form: table
        at: page=4&bbox=0.1534,0.1305,0.6083,0.0939
        layout: grid
        scopes:
          - form: caption
            at: page=4&bbox=0.2955,0.211,0.4082,0.0134
            text: "Table 1: Parameters determined by this procedure"
          - form: row
            at: page=4&bbox=0.1534,0.1305,0.3023,0.0128
            cells: [Parameter, SI unit, Description]
          - form: row
            at: page=4&bbox=0.1539,0.1488,0.482,0.016
            cells: ["$Q_{L,k,y}$", GJ/yr, Heat lost from pipe run k in year y]
          - form: row
            at: page=4&bbox=0.1539,0.168,0.4588,0.0161
            cells: ["$Q_{T,y}$", GJ/yr, Heat lost from all runs in year y]
          - form: row
            at: page=4&bbox=0.1539,0.1873,0.6078,0.016
            cells: ["$Q_{U,y}$", GJ/yr, Heat loss reported with the uncertainty allowance]
  - form: heading
    at: page=4&bbox=0.1441,0.2502,0.2589,0.0156
    level: 1
    num: "5."
    text: Calculation procedure
    scopes:
      - form: heading
        at: page=4&bbox=0.1439,0.2913,0.2672,0.0134
        level: 2
        num: "5.1."
        text: Heat loss from a pipe run
        scopes:
          - form: paragraph
            at: page=4&bbox=0.1436,0.3187,0.7061,0.0536
            num: "11."
            text: "The heat lost from pipe run k in year y is the sum over its segments of the product of the outer surface area, the surface heat transfer coefficient and the temperature difference to the ambient, over the hours of operation, as follows:"
          - form: equation
            at: page=4&bbox=0.2842,0.3844,0.572,0.0293
            label: Equation (1)
            tex: Q_{L,k,y} = \sum_{i} A_{i,k,y} \times U_{i,y} \times \Delta T_{i,y} \times t_{y}
          - form: paragraph
            at: page=4&bbox=0.1429,0.4286,0.0589,0.0102
            text: "Where:"
          - form: definition-list
            at: page=4&bbox=0.15,0.4571,0.6974,0.123
            scopes:
              - form: definition
                at: page=4&bbox=0.1506,0.4571,0.4382,0.0162
                cells: ["$Q_{L,k,y}$", "=", Heat lost from pipe run k in year y (GJ/yr)]
              - form: definition
                at: page=4&bbox=0.1503,0.4741,0.6788,0.033
                cells: ["$A_{i,k,y}$", "=", Outer surface area of the insulation of segment i of pipe run k in year y (m2)]
              - form: definition
                at: page=4&bbox=0.1509,0.5105,0.6212,0.0162
                cells: ["$U_{i,y}$", "=", Surface heat transfer coefficient of segment i in year y (W/m2 K)]
              - form: definition
                at: page=4&bbox=0.1505,0.5276,0.6969,0.0334
                cells: ["$\\Delta T_{i,y}$", "=", Difference between the surface temperature of segment i and the ambient temperature in year y (K)]
              - form: definition
                at: page=4&bbox=0.15,0.564,0.4405,0.0161
                cells: ["$t_{y}$", "=", Hours of operation of the run in year y (h)]
      - form: heading
        at: page=4&bbox=0.1439,0.6001,0.325,0.0102
        level: 2
        num: "5.2."
        text: Surface heat transfer coefficient
        scopes:
          - form: paragraph
            at: page=4&bbox=0.1433,0.6275,0.7043,0.0737
            num: "12."
            text: The surface heat transfer coefficient combines convection and radiation from the outer face of the insulation. Where no site measurement of the convective part is available, the default convective coefficient of the Office applies and the radiative part is calculated from the emissivity of the cladding, as follows:[^1]
          - form: footnote
            at: page=4&bbox=0.1435,0.8764,0.6474,0.0254
            mark: "1"
            text: The default convective coefficient is published in the Office's table of defaults and revised annually.
          - form: equation
            at: page=4&bbox=0.3154,0.7134,0.5408,0.0178
            label: Equation (2)
            tex: U_{i,y} = h_{i,y} + 4 \times \epsilon_{i} \times \sigma \times T_{s,i,y}^{3}
          - form: paragraph
            at: page=4&bbox=0.1429,0.7462,0.0589,0.0102
            text: "Where:"
          - form: definition-list
            at: page=4&bbox=0.1501,0.7747,0.6736,0.0676;page=5&bbox=0.1501,0.1037,0.4611,0.033
            scopes:
              - form: definition
                at: page=4&bbox=0.1509,0.7747,0.6105,0.0161
                cells: ["$U_{i,y}$", "=", Surface heat transfer coefficient of segment i in year y (W/m2 K)]
              - form: definition
                at: page=4&bbox=0.1507,0.7917,0.673,0.033
                cells: ["$h_{i,y}$", "=", Convective heat transfer coefficient at the surface of segment i in year y (W/m2 K)]
              - form: definition
                at: page=4&bbox=0.1501,0.8281,0.5327,0.0142
                cells: ["$\\epsilon_{i}$", "=", Emissivity of the cladding of segment i (dimensionless)]
              - form: definition
                at: page=5&bbox=0.1503,0.1037,0.3982,0.0131
                cells: ["$\\sigma$", "=", Stefan-Boltzmann constant (W/m2 K4)]
              - form: definition
                at: page=5&bbox=0.1501,0.1206,0.4611,0.0161
                cells: ["$T_{s,i,y}$", "=", Surface temperature of segment i in year y (K)]
          - form: paragraph
            at: page=5&bbox=0.1434,0.1497,0.6606,0.0335
            num: "13."
            text: "The temperature difference of a segment is the difference between its surface temperature and the ambient temperature of the space:"
          - form: equation
            at: page=5&bbox=0.3621,0.1954,0.4941,0.016
            label: Equation (3)
            tex: "\\Delta T_{i,y} = T_{s,i,y} - T_{a,y}"
          - form: paragraph
            at: page=5&bbox=0.1429,0.2263,0.0589,0.0102
            text: "Where:"
          - form: definition-list
            at: page=5&bbox=0.1501,0.2549,0.691,0.0694
            scopes:
              - form: definition
                at: page=5&bbox=0.1505,0.2549,0.6906,0.0335
                cells: ["$\\Delta T_{i,y}$", "=", Difference between the surface temperature of segment i and the ambient temperature in year y (K)]
              - form: definition
                at: page=5&bbox=0.1501,0.2913,0.4655,0.0161
                cells: ["$T_{s,i,y}$", "=", Surface temperature of segment i in year y (K)]
              - form: definition
                at: page=5&bbox=0.1501,0.3082,0.4728,0.0161
                cells: ["$T_{a,y}$", "=", Ambient temperature of the space in year y (K)]
      - form: heading
        at: page=5&bbox=0.1439,0.3442,0.397,0.0134
        level: 2
        num: "5.3."
        text: Annual total and uncertainty allowance
        scopes:
          - form: paragraph
            at: page=5&bbox=0.1433,0.3717,0.6648,0.0335
            num: "14."
            text: "The heat lost from all runs is the sum of the losses of the individual runs. The reported figure carries an uncertainty allowance, as follows:"
          - form: equation
            at: page=5&bbox=0.3236,0.4173,0.5326,0.0296
            label: Equation (4)
            tex: Q_{U,y} = (1 + u_{y}) \times \sum_{k} Q_{L,k,y}
          - form: paragraph
            at: page=5&bbox=0.1429,0.4618,0.0589,0.0102
            text: "Where:"
          - form: definition-list
            at: page=5&bbox=0.1502,0.4903,0.6429,0.0499
            scopes:
              - form: definition
                at: page=5&bbox=0.1506,0.4903,0.6425,0.0162
                cells: ["$Q_{U,y}$", "=", Heat loss reported with the uncertainty allowance in year y (GJ/yr)]
              - form: definition
                at: page=5&bbox=0.1502,0.5072,0.4358,0.0161
                cells: ["$u_{y}$", "=", Uncertainty allowance in year y (fraction)]
              - form: definition
                at: page=5&bbox=0.1506,0.524,0.4382,0.0162
                cells: ["$Q_{L,k,y}$", "=", Heat lost from pipe run k in year y (GJ/yr)]
          - form: paragraph
            at: page=5&bbox=0.1433,0.5532,0.7006,0.032
            num: "15."
            text: "The uncertainty allowance is determined by the measurement arrangement of the run, as follows:"
          - form: list
            at: page=5&bbox=0.1437,0.5981,0.7051,0.1311
            scopes:
              - form: list-item
                at: page=5&bbox=0.1437,0.5981,0.7051,0.0322
                num: "(a)"
                text: Where every segment carries a calibrated surface sensor read at least weekly, the allowance is 0.05;
              - form: list-item
                at: page=5&bbox=0.1437,0.6468,0.6196,0.0322
                num: "(b)"
                text: Where the surface temperature is measured monthly with a hand-held instrument, the allowance is 0.10;
              - form: list-item
                at: page=5&bbox=0.1437,0.6955,0.6173,0.0337
                num: "(c)"
                text: In all other cases the allowance is 0.20, and the operator shall state the arrangement in the report.
          - form: paragraph
            at: page=5&bbox=0.1434,0.7444,0.6521,0.0334
            num: "16."
            text: Figure 1 shows the segments of a run and the positions at which the surface temperature is measured.
          - form: figure
            at: page=5&bbox=0.2316,0.8252,0.537,0.0135
            scopes:
              - form: caption
                at: page=5&bbox=0.3217,0.8796,0.3566,0.0135
                text: "Figure 1: Segments of an insulated pipe run"
  - form: heading
