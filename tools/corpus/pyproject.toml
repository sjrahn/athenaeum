[project]
name = "ath-corpus"
version = "0.1.0"
description = "Corpus tooling for ATH-CORPUS v1.0 — capture, ingest, draft, resolve, lint."
readme = "README.md"
requires-python = ">=3.12"
license = "CC-BY-SA-4.0"
authors = [{ name = "Steven Rahn", email = "steven@rahn.dev" }]
dependencies = [
    # base floor: model + IO + schema layer + lint + resolver(image/pdf/html) + drafters(pdf/html/image)
    "blake3>=1.0.4",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
    "pypdf>=5.1",
    "pypdfium2>=4.30",
    "Pillow>=11.0",
    "pillow-avif-plugin>=1.5",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
capture        = ["playwright>=1.49"]
# The `[curl-cffi]` extra adds yt-dlp's browser-impersonation transport. Without it
# some hosts (TikTok) serve a degraded, audio-less stream — or fail extraction
# outright — so transcription has nothing to work with. Requesting it via yt-dlp's
# own extra (rather than pinning curl_cffi ourselves) keeps the version inside the
# range yt-dlp's handler accepts; a bare floor resolves too new and the handler
# silently refuses to load. See gotchas (TikTok capture).
media          = ["yt-dlp[curl-cffi]>=2024.10", "yt-dlp-ejs>=0.8"]
# docx drafting uses only the stdlib; xlsx needs openpyxl, xls needs xlrd.
office         = ["openpyxl>=3.1", "xlrd>=2.0.1"]
# text simhash is pure-Python (no dep); image pHash needs imagehash, audio
# chromaprint needs pyacoustid (+ the fpcalc system binary).
fingerprint    = ["imagehash>=4.3", "pyacoustid>=1.3"]
azure          = ["azure-storage-blob>=12.20", "azure-identity>=1.17"]
s3             = ["boto3>=1.34"]
crypto         = ["cryptography>=48.0.0"]
claude-session = []

[project.scripts]
corpus = "corpus._cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corpus"]

# Ship the bundled universal schemas (YAML) + the vendor dir (README, and the
# SingleFile bundle when an operator has dropped it in) inside the wheel.
[tool.hatch.build.targets.wheel.force-include]
"src/corpus/schemas_default" = "corpus/schemas_default"
"src/corpus/vendor" = "corpus/vendor"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-mock>=3",
    "ruff>=0.7",
    # Optional-extra deps the test suite exercises (office drafters, image pHash).
    "openpyxl>=3.1",
    "xlrd>=2.0.1",
    "imagehash>=4.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"src/corpus/_cli/*.py" = ["E501", "SIM"]
"src/corpus/_cli/__init__.py" = ["E501"]
"src/corpus/lint.py" = ["E501", "RUF001", "RUF002"]  # spec-typography (§, en-dash) in messages
"src/corpus/recordbuild.py" = ["E501"]
# Static regex/signature catalog — long compiled patterns + intentional mojibake
# literals (ambiguous Unicode is the point, not a typo).
"src/corpus/quality/signatures.py" = ["E501", "RUF001", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that require network access (skipped by default)",
]
