[project]
name = "ath-corpus"
version = "0.1.0"
description = "Corpus tooling for ATH-CORPUS v1.0 — capture, ingest, draft, resolve, lint."
readme = "README.md"
requires-python = ">=3.12"
license = "CC-BY-SA-4.0"
authors = [{ name = "Steven Rahn", email = "steven@rahn.dev" }]
dependencies = [
    # base floor: model + IO + schema layer + lint + resolver(image/pdf/html) + drafters(pdf/html/image)
    "blake3>=1.0.4",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
    "pypdf>=5.1",
    "pypdfium2>=4.30",
    "Pillow>=11.0",
    "pillow-avif-plugin>=1.5",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
capture        = ["playwright>=1.49"]
# yt-dlp, full-featured and current. `[default]` is yt-dlp's recommended runtime set
# (brotli, mutagen, pycryptodomex, websockets, certifi, requests/urllib3, and
# yt-dlp-ejs — the YouTube JS-challenge solver); `[curl-cffi]` adds the browser-
# impersonation transport. Without impersonation some hosts (TikTok) serve a
# degraded, audio-less stream; requesting it via yt-dlp's own extra keeps curl_cffi
# inside the version range its handler accepts (a bare floor resolves too new and the
# handler silently refuses to load — see gotcha #38). Pinned to the NIGHTLY channel
# (a `.dev` pre-release floor, which lets uv resolve pre-releases for this package):
# the stable channel lagged months behind TikTok's page changes — extraction failed
# to a video-only, audio-less stream — while nightly extracts every format with audio.
# `uv lock --upgrade-package yt-dlp` pulls the newest nightly. See gotchas (TikTok).
media          = ["yt-dlp[default,curl-cffi]>=2026.5.25.234532.dev0"]
# docx drafting uses only the stdlib; xlsx needs openpyxl, xls needs xlrd.
office         = ["openpyxl>=3.1", "xlrd>=2.0.1"]
# text simhash is pure-Python (no dep); image pHash needs imagehash, audio
# chromaprint needs pyacoustid (+ the fpcalc system binary).
fingerprint    = ["imagehash>=4.3", "pyacoustid>=1.3"]
azure          = ["azure-storage-blob>=12.20", "azure-identity>=1.17"]
s3             = ["boto3>=1.34"]
crypto         = ["cryptography>=48.0.0"]
claude-session = []
# Local Claude-proxy tokenizer for the per-record token-count derived view (corpus.tokens).
# tiktoken is lazy-imported (never at module load), so the base install + import guard stay
# clean without this extra; without it token counts fall back to a chars/4 heuristic.
tokens         = ["tiktoken>=0.8"]
# Read-only HTTP API over the corpus library (serves the Angular Corpus Console).
# FastAPI/uvicorn are imported only inside `corpus.api`, never by the base library, so
# the base install (and `import corpus.draft`) stays clean without this extra (gotcha #24).
# Pulls in `tokens` so the served token-count field gets real (not heuristic) counts.
api            = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "python-multipart>=0.0.12", "tiktoken>=0.8"]

[project.scripts]
corpus = "corpus._cli:main"
corpus-api = "corpus.api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corpus"]

# Ship the bundled universal schemas (YAML) + the vendor dir (README, and the
# SingleFile bundle when an operator has dropped it in) inside the wheel.
[tool.hatch.build.targets.wheel.force-include]
"src/corpus/schemas_default" = "corpus/schemas_default"
"src/corpus/vendor" = "corpus/vendor"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-mock>=3",
    "ruff>=0.7",
    # Optional-extra deps the test suite exercises (office drafters, image pHash).
    "openpyxl>=3.1",
    "xlrd>=2.0.1",
    "imagehash>=4.3",
    # FastAPI's TestClient needs httpx; the HTTP test module is import-skipped unless the
    # `[api]` extra is also installed, so the no-extra suite + base-import guard stay green.
    "httpx>=0.27",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"src/corpus/_cli/*.py" = ["E501", "SIM"]
"src/corpus/_cli/__init__.py" = ["E501"]
"src/corpus/api/*.py" = ["E501", "B008"]  # long route literals; FastAPI Query() in defaults is idiomatic
"src/corpus/lint.py" = ["E501", "RUF001", "RUF002"]  # spec-typography (§, en-dash) in messages
"src/corpus/recordbuild.py" = ["E501"]
# Static regex/signature catalog — long compiled patterns + intentional mojibake
# literals (ambiguous Unicode is the point, not a typo).
"src/corpus/quality/signatures.py" = ["E501", "RUF001", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that require network access (skipped by default)",
]
