# The `reference` context namespace — a source a record's body mentions (a book, an
# article, a bare external link), captured as an annotation addressed back to where it is
# mentioned and resolved up the lossy→lossless citation ladder (spec §4.3.3, §4.4.5).
#
# Emitted as `<!--context reference[/<id>]-->` in the annotations zone. Dual-source: either
# normalizer-/human-asserted (no `provenance`), or mechanically emitted by the drafter with
# `provenance: auto` — from a detected bare link, or from an origin overlay's
# `capture.references` declaration (a host's dependent reference material, e.g. a PDP's
# product manual; spec §7.2). Never part of the faithful body or the canonical hash.

description: |
  A source the body references. Starts as free-text attribution and is researched up the
  citation ladder (§4.4.5): attribution_text → source_url. Whether that URL is itself a
  captured record is a READ-TIME edge — resolved from source_url against the URI index by
  derived_views.references (§9.9) / `corpus links --references` — not a stored field; the
  mechanical (provenance: auto) drafter never writes source_uri (it must stay a pure
  function of the artifact, spec §4.3.3.3). The optional source_uri tier below is reserved
  for an *asserted* reference (see its note). The `address` (+ optional `quote`) pins the
  reference back to the exact mention.

applies_at: [record, segment]

extended_fields:
  # ---- anchor: where in the record it is mentioned ----
  address:
    type: string
    required: false
    description: |
      Segment address of the mention (presence makes the reference segment-scoped; absence
      record-scoped). The coarse anchor; `quote` sharpens it to the exact phrase.
  quote:
    type: string
    required: false
    description: |
      Verbatim span copied from the segment body where the source is mentioned — the exact
      phrase ("as Piketty argues in Capital"). Stable across redrafts because the body is an
      immutable rendering of the immutable artifact; preferred over character offsets.
  occurrence:
    type: integer
    required: false
    description: |
      1-based index disambiguating which match, when `quote` appears more than once in the
      addressed segment. Omit when the quote is unique.

  # ---- the three-tier citation ladder (§4.4.5), lossy → lossless ----
  attribution_text:
    type: string
    required: false
    description: |
      Tier 1 — free-text attribution exactly as the body gives it ("Piketty's Capital in the
      Twenty-First Century"). Ambiguous but captured; always safe to record first.
  source_url:
    type: string
    semantic_type: uri
    required: false
    description: |
      Tier 2 — a resolvable URL for the source, once researched. Aggregated into the `uris`
      derived view (§9.3).
  source_uri:
    type: string
    required: false
    description: |
      Tier 3 — a functional `corpus://<id>` URI pointing at the separately-captured record
      for this source (lossless intra-corpus link). Written ONLY by an *asserted*
      (normalizer-/human-authored) reference, and only when the target has no resolvable
      `source_url` to derive the edge from (a born-internal record, or an explicit hand
      link). The mechanical drafter never writes it: a link-backed reference's intra-corpus
      edge is resolved at read time from `source_url` (derived_views.references §9.9), so it
      self-heals instead of dangling. Lint flags a dangling target (now only ever an
      asserted one).

  # ---- role: only on mechanical (overlay-declared) references ----
  role:
    type: string
    required: false
    description: |
      The kind of dependent material this link is, copied from the matching
      `capture.references` rule (`manual`, `spec-sheet`, …; spec §7.2). Corpus-local —
      the value set is whatever a corpus's overlays declare; cross-corpus tooling treats
      unknown values gracefully. Present on mechanical (`provenance: auto`) references;
      normally absent on normalizer-/human-asserted citations.
