# The `note` context namespace — free-text editorial annotation a human or the normalizer
# attaches to a record or a segment (spec §4.3.3). Emitted as `<!--context note-->`. Always
# asserted (no mechanical source); never part of the faithful body or the canonical hash.

description: |
  A free-text editorial note about the record or a segment within it — commentary, context,
  a reminder. Distinct from an `issue` (a problem with a lifecycle) and a `reference` (a
  resolved source); this is just prose the reader/normalizer wanted to attach.

applies_at: [record, segment]

extended_fields:
  address:
    type: string
    required: false
    description: |
      Optional segment address. Presence makes the note segment-scoped; absence record-scoped.
  body:
    type: string
    required: false
    description: The note text.
