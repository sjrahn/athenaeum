# Missing-media issues — a cross-reference in the body points at content that is no
# longer addressable (a segment that has been re-segmented; an embed that was pruned;
# an external resource that 404s).

description: |
  A reference in the body points at content that is no longer addressable. Typical
  cause: re-segmentation invalidated a prior address; an embed was pruned; an
  external resource is gone. The reference is left in place and surfaced via this
  issue for later repair.

applies_at: [record, segment]
