# Page served a sign-in / login wall instead of the requested content.
# Distinct from `paywall` (which gates content behind payment).
# Emitted by the capture-stage detector in capture-url.py.

description: |
  The captured page is a sign-in / login wall — the user would need to
  authenticate before seeing the underlying article. The captured bytes
  represent the wall, not the content. Typically a warning rather than
  blocking because the wall itself is a meaningful artifact (it tells us
  the publisher gated the content); resolution is to re-capture with an
  authenticated CDP session if access is needed.

applies_at: [record]

extended_fields:
  signature:
    type: string
    required: true
    description: |
      Short identifier for the matched signature (`login-required-title`,
      `create-account-body`). Drawn from
      `corpus.quality.signatures.LOGIN_WALL_SIGNATURES`.
