form_id: index
kind: form
description: |
  An index (spec §7.8): a page whose entries ARE the content — a table of contents, a
  category or directory listing, a link hub, a site map, an availability matrix. Each
  entry names (and usually links) a target elsewhere; the page's value is the set of
  entries and their labels, not prose. Names a SHAPE, never a subject. The boundary
  against every content form: when a page both lists and substantially TELLS, the
  telling wins (it is an article/document with links); a page is an index when removing
  its entries would leave nothing. Entries may be plain links, a tabular listing (a
  bulletin index: Number | Date | Title), or a matrix of what exists where — the
  contract is the same: entries verbatim, complete, and never fabricated.
extended_fields:
  entry_count:
    type: integer
    required: false
    description: |
      The number of entries the rendered span carries, when stated. Mechanically
      derivable from the span's own bytes (recount the rendered entries); useful as the
      coverage anchor — an index promising N entries is the natural cross-check against
      what a crawl captured.
decomposition: |
  The span renders the entry set faithfully in source order: link entries as a markdown
  list (label + target URL, the source's own grouping headings preserved); tabular
  listings as `text/data-table` with the source's columns; an availability matrix as its
  faithful grid. Framing text the page itself presents (a breadcrumb, a category
  heading, a count line) stays as text segments. An entry whose target the source
  renders dead (an href-less anchor, a stale link) stays as its faithful text — never
  repaired, never dropped. No prose is added; an index with zero entries renders as its
  honest empty listing.
checks:
  address_axes: [el, pages, page]
  monotonic: true
normalization:
  guidance: |
    The entries are the content: render every one, verbatim labels, no editorial
    grouping beyond the source's own, no fabricated targets. Where the page promises a
    listing that was never captured (an empty shell), persist a `missing-media` /
    `partial-content` issue rather than inventing entries.

    On a whole-record span, the section header's `title:`/`description:` fields are the
    vouch's home (implicitly role-marked, spec §4.2.3/§4.3.2.1) — never the frontmatter.
    Title from the page's own title shorn of site chrome; the description says what the
    index lists and its extent ("lists 7 available information types", "122 connector
    views in 9 groups") — composable mechanically from the entry census.
