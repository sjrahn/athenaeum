form_id: manifest
kind: form
terminal: true
description: |
  The CONTAINER specialization of the terminal contract (spec §7.8, 3.3): the members ARE
  the content (`disposition: manifest`, §1.2), so conformance binds the record's attested
  member embeds — the roster IS the attestation, nothing re-stated in a content-zone
  rendering — and the editorial header, where written, vouches the CONTAINER (what this
  bundle is, what its members span), never a per-member summary (that is each promoted
  member's own record, formed or terminal in its own right). One derivation keeps the
  judgment single: a `disposition: manifest` record with no rendering contract declared
  for it stands under this contract automatically (§7.8) — the disposition already IS the
  terminal judgment, zero overlay edits required. An overlay MAY still bind a genuine
  rendering contract over a manifest-disposition record where one applies; the explicit
  declaration wins over this derivation.
extended_fields: {}
decomposition: |
  None — a terminal contract prescribes the ABSENCE of a stored rendering, so there is no
  decomposition to declare. Conformance binds the attested MEMBER EMBEDS already carried
  in the metadata zone (the manifest embeds ingest/attest stamped, §8.1), not a
  content-zone rendering; the content zone holds container byte-marks only (or nothing).
checks: {}
normalization:
  guidance: |
    There is no per-member shaping work on the container record — its members are
    independently promotable, first-class records of their own. The only licensed pass
    work here is the optional whole-record opener's editorial header (§4.2.3): what this
    bundle is and what its members span, composed from the attested roster (member count,
    kinds, date range where derivable) — a deliberate describe pass, never demand (§8.5),
    and never a fabricated per-member summary.

    Where written, the section header's `title:`/`description:` fields are the vouch's
    home — never the frontmatter. A faithful title names the container itself (e.g.
    "iMessage export — Jane Doe, 2019-2026"); the description names what the roster holds.
