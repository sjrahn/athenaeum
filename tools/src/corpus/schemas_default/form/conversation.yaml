form_id: conversation
kind: form
description: |
  A time-ordered, participant-attributed message sequence (spec §7.8). The form is
  MODALITY-BLIND: it covers a chat export addressed at `turn=` and a recorded meeting
  addressed at `time_range=` with the same envelope. What it names is a SHAPE, never a
  subject — which people, which platform, what the conversation is about are the origin
  block's, the bytes', and the ledger's concerns, never this overlay's (§7.8, the
  forms-name-shapes-never-subjects line).

  A THIRD axis, `el=<N>`, covers a chat export drafted from an HTML producer (one
  addressable element per message/attachment, §6.2) rather than a JSON message array —
  the imessage-conversation-adopt-32 finding (the §12.22 lesson repeats: measure the real
  bodies before trusting a contract's enumerated axes). `el=` behaves as an ordinary
  ordinal turn axis for this producer family (one bubble = one element, assigned in
  chronological/document order), so `monotonic` stays meaningful for it — unlike the five
  generic document-family forms, which dropped `monotonic` because their `el=` is a raw
  extraction index, not reading order (§12.22).
extended_fields:
  participants:
    type: list
    required: true
    role: title
    description: |
      The authorship-ordered codebook — first-appearance order, entry grammar
      "<display> <durable-id>". A `text/message` segment's `participant:` integer indexes
      this list (§7.3). Mechanically derivable from the span's own bytes (the distinct
      authors, in first-appearance order), always. *(3.2, §4.2.3)* Marked `role: title`
      as the form layer's mechanical fallback candidate — checked only when the whole-
      record section carries no implicit `title:` (the interpretive vouch, still checked
      first): a mechanically-shaped conversation with no authored title yet derives a
      comma-joined participant list rather than an honest-but-unhelpful empty string —
      a shaped-not-yet-vouched thread is not a defect, but it should not read as
      nameless when its own codebook already names who is in it.
decomposition: |
  The span decomposes into one `text/message` segment per message at the addressing axis
  (`turn=<N>` for a chat export, `time_range=<s>-<e>` for a recorded meeting), each carrying
  its author (the `participant:` codebook index or a verbatim `sender:`), timestamp, and a
  `reply_to` where the platform's own reference resolves in-record. Platform-generated event
  lines (join/leave/call) are `text/metadata` segments. An attachment declared by a message
  rides a sibling `image`/`video`/`audio` marker at the composed address `turn=<N>&att=<M>`
  (no embed — lineage-resolvable, §4.3.1.4). A platform's own topic boundary is a
  `<!--segment structural-->` byte-mark; a per-day grouping is NOT (whose midnight?) — it is
  the `corpus toc` read-time rendering (§4.3.2.3).
checks:
  envelope_required: [participants]
  codebook:
    - segment_field: participant
      codebook_field: participants
  address_axes: [turn, time_range, el]
  monotonic: true
normalization:
  guidance: |
    Author one `text/message` per message in reading order, body = the verbatim message
    text (empty when the message is attachment-only). Derive the `participants:` codebook
    mechanically as the distinct authors in first-appearance order; index each message's
    author into it via `participant:` (or carry a verbatim `sender:` when the source's
    records use that form). Timestamps stay in the source-stated zone. Never invent a
    day-break section — that is a read-time rendering (§4.3.2.3).

    On a whole-record span, the section header's `title:`/`description:` fields are the
    vouch's home (implicitly role-marked, spec §4.2.3/§4.3.2.1) — never the frontmatter.
    A faithful title names who the conversation is with/among; the description says who's
    in it and what it covers.
