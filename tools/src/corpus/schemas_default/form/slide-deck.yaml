form_id: slide-deck
kind: form
description: |
  An ordered sequence of visually-composed slides (spec §7.8) — a presentation's shape:
  a slide video, a webinar screen track, a deck export. Names a SHAPE, never a subject —
  which event, whose deck, what it presents are the origin block's and the ledger's
  concerns. Modality-blind by axis: a video-borne deck addresses each slide at
  `time_range=` (its on-screen interval; the representative still derives at `frame=`
  through the resolver); a native deck export (pptx and kin) joins the axis list with
  its first consumer.
extended_fields:
  slide_count:
    type: integer
    required: true
    description: |
      The number of slides the span carries — exactly the count of its slide units,
      mechanically derivable (and checkable) from the span itself.
decomposition: |
  The span decomposes into one slide unit per slide, in presentation order: an `image`
  marker segment at the slide's address (video-borne: `time_range=<s>-<e>`, the interval
  the slide holds the screen; the still derives at `frame=<s>` — no embed,
  lineage-resolvable) plus, where the slide carries text, a sibling `text/ocr` segment
  at the same address with the on-screen text verbatim in reading order. Time addresses
  use the corpus MM:SS convention (HH:MM:SS past the hour). On a promoted TRACK record,
  render stills through the CONTAINER by lineage (`corpus://<container>?frame=…`) — a
  raw elementary stream (Annex-B) is not independently seekable, so `frame=` on the
  track's own hash fails by construction (pilot finding, §12.20). What a slide SHOWS
  beyond its on-screen text (figures, photos, layout) is not narrated: the `image` marker
  is a body-empty positioning mark, permanent, and there is no field on it to describe
  what it shows (§4.3.2.2). The deck's own declared grouping (an agenda, the
  container's chapter marks inherited through lineage) is structural marks or sections,
  never extra slides.
checks:
  envelope_required: [slide_count]
  address_axes: [time_range]
  monotonic: true
normalization:
  guidance: |
    Boundaries are mechanically proposed (the pinned scene-cut op) and verified by eye
    against rendered stills (`corpus preview`, `frame=` transforms) — merge a slide's
    animation steps into one unit, split missed cuts. One body-empty `image` marker per
    slide, permanent; transcribe on-screen text verbatim as `text/ocr` (reading order, no
    paraphrase). A slide's non-text visual content (a photo, a layout, an unreadable
    diagram) is not described — the marker alone is the complete, honest rendering; a
    genuine faithfulness defect is a typed `issue`, never prose. Set `slide_count` to the
    slide-unit count. Narration is NOT this record's content — it lives on the sibling
    audio track's `form/transcript`; the same-video composition joins the two on
    (lineage × timeline).

    Do not write `title:` or `description:` on the section header: the universal
    section-header fields retired in 3.5, and a form marks no editorial candidate
    (§4.2.3). `slide_count`, above, is this span's only header field, and it is a
    mechanical recount, not a title. What the deck presents, whose it is, and what
    event it belongs to are not the record's to say — a ledger claim names them,
    citing the span.
