form_id: procedure
kind: form
description: |
  Stepped work instructions (spec §7.8): content whose shape is an ordered sequence of
  actions meant to be PERFORMED — removal/installation and repair procedures, diagnostic
  and test sequences (including trouble-code charts: named condition blocks plus ordered
  diagnostic steps), calibration and programming sequences, recipes, runbooks. Names a
  SHAPE, never a subject (`form/procedure`, never `form/<site>-procedure`). The boundary
  against `form/article` is imperative structure: steps to perform, in order, with
  branch points — not prose to understand. A procedure page's framing prose (purpose,
  special tools, definitions) belongs to the span; the steps are its spine.
extended_fields: {}
decomposition: |
  The span preserves the source's own procedural structure: named phase or condition
  headings ("Removal", "Installation", "Diagnostic Aids", "Conditions for Setting the
  DTC") as markdown headings; the numbered steps as ordered lists in source order,
  verbatim, never renumbered or reflowed. Cautions / warnings / notes stay INLINE at the
  step they govern — never hoisted away. Decision branches ("if …, go to step N") stay
  intact at their branch point, nested under the step where the source nests them.
  Torque values, clearances, measurement targets, special-tool identifiers survive
  verbatim at their step. Mid-procedure figures are body-empty `image` markers, permanent,
  at their source position, with a lossless sibling `text/ocr`/`text/data-table`
  transcription where a figure region is genuinely text or tabular (§4.3.2.2 — a marker
  never narrates; there is no `description:` to fill). Named supporting blocks (special
  tools, required parts) render as their faithful
  list or `text/data-table`. Where the source's procedural spine IS a decision table
  (Step | Action | Yes | No — a common diagnostic shape), that table rendered as
  `text/data-table` is the faithful spine: the ordered-list discipline applies to
  sources that present ordered lists, never as a reflow target.
checks:
  address_axes: [el, pages, page]
normalization:
  guidance: |
    Keep step ORDER and step INTEGRITY absolute: no merging, no splitting, no
    paraphrase — a wrong or reordered step in service content is a safety defect, and a
    caution separated from its step is a broken caution. Where the source presents a
    branch table or decision matrix, render it as the table it is rather than flattening
    to prose.

    This form declares no `extended_fields`, so its opener is BARE — `<!--section
    procedure-->` and nothing else — and that is complete (spec §4.3.2.1). Do not write
    `title:` or `description:` on it: the universal section-header fields retired in 3.5
    and the count of them is now zero. What the procedure does, and to what (and for a
    diagnostic chart, which codes/conditions it covers), is not the record's to
    summarize — a ledger claim names it, citing the span.
