form_id: document
kind: form
description: |
  A page-like faithful rendering whose payload is figures, tables, or mixed plate matter
  (spec §7.8): the generic contract for artifacts that genuinely render as pages of
  presented content — a connector view sheet, a torque-specification plate, a parts or
  labor catalog, a wiring schematic page, a datasheet, a form, a spreadsheet workbook's
  data-table worksheets. Names a SHAPE, never a subject. NOT a catch-all: an artifact
  with no faithful page rendering (code, datasets, binaries, containers) stays formless
  — stamping `document` on it would assert a shape its bytes do not have. The boundary
  against `form/article` is which way the dependency runs: here the figures/tables/plates
  ARE the content and prose frames them; prose-led reading matter is an article. Stepped
  work instructions are `form/procedure`; an entries-are-the-content listing is
  `form/index`. `data-table-set` is deliberately not its own form (spec §7.8) —
  table-payload pages, including a workbook's worksheets, are documents.
extended_fields: {}
decomposition: |
  The span carries the page's presented content in source order: framing text (a
  breadcrumb, a heading, a caption) as text segments; every figure as a body-empty
  `image` marker, permanent (§4.3.2.2 — a marker says where the bytes are, never what
  they contain, and there is no field on it to say more); every losslessly-transcribable
  figure region (a spec table, a pin-out, a parts list, a legend) as a sibling `text/ocr`
  or `text/data-table` segment at the chained address (`el=N&bbox=…`), cells verbatim.
  Where a transcription covers the figure's whole own region it REPLACES the marker —
  two segments on one region earn their place only by extracting different information.
  Machine-readable tables render directly as `text/data-table` (markdown grid, or literal
  HTML `<table>` where structure demands). A drawing whose payload is a relation the
  drawing STATES — a wiring, vacuum, or hydraulic circuit, a block diagram — is not a
  document page: it is `form/schematic`, whose contract binds the figure to a from-to
  transcription of that relation (2026-07-26, reversing this contract's earlier ruling
  that schematic topology is not losslessly textualizable — tracing a drawn connection is
  transcription; fabricating an unshown one, which that ruling rightly refused, still is
  not). A drawing with no relation to state — a component photo, an exploded parts view,
  a location illustration — stays here: its body-empty `image` marker plus any discrete
  text legend or callout, losslessly transcribed as its own segment, are its faithful
  rendering.

  A spreadsheet workbook (xlsx/xls) decomposes the same way at the mime's own axis: one
  section per worksheet, addressed `sheet=<tab-name>` (its child `text/data-table` /
  `text/data-table-dynamic` segments at the same address, optionally narrowed
  `sheet=<tab-name>&bbox=<A1-range>`) — see the spreadsheet mime schemas' normalization
  guidance for the section/segment shape. Asserting `document` on those sections is the
  same contract as any other page-like payload: the worksheets ARE the content.
checks:
  address_axes: [el, pages, page, block, sheet]
normalization:
  guidance: |
    The lossless extraction IS the value of this form: transcribe every readable table,
    legend, and callout region exactly (fastener | value | unit | condition; pin | wire
    color | circuit | function), never summarize, and leave a genuinely unreadable cell
    blank with a `partial-content` issue naming it — never guess a value. Where the page
    promises content that was never captured, persist a `missing-media` issue — never
    fabricate.

    **A body-empty marker is a finished statement, not a placeholder for prose.**
    Description retired everywhere in 3.5, on segments as much as sections (§4.3.2.2) — a
    segment cannot narrate its own region, and there is no field anywhere a marker can
    carry a reading of its own content. Where a figure's content matters and can be read
    off the bytes, transcribe it losslessly as a sibling segment (above); where it cannot
    (layout, composition, a photo's own visual content), the marker alone — permanent — is
    the complete, honest rendering, and `corpus resolve` is how a reader reaches it. A
    genuine faithfulness defect (blurry, cut off, corrupted) is a typed `issue` at that
    address, never a description — "this is a photo" is not a finding.

    This form declares no `extended_fields`, so its opener is BARE — `<!--section
    document-->` and nothing else — and that is complete (spec §4.3.2.1). Do not write
    `title:` or `description:` on it: the universal section-header fields retired in 3.5
    and the count of them is now zero. What the page presents, and what a reader can
    recover from it, is not the record's to say — a synopsis is a ledger claim citing
    the span.
