form_id: schematic
kind: form
description: |
  A drawn-relation sheet: a diagram whose payload is a relation the drawing itself
  STATES — a wiring schematic's conductor set, a vacuum or hydraulic circuit, a block
  diagram's link set (spec §7.8). Names a SHAPE, never a subject: which system a sheet
  draws is the origin block and the ledger's business, never this contract's.

  This form names the SHAPE — *this thing is a schematic* — and nothing more. It does NOT
  prescribe a from-to table: a schematic is a drawing that **could** be losslessly
  represented as one, and whether it actually is depends on whether the relation can be read
  off these bytes. Both renderings are conforming, and the contract has no standing to demand
  the better one:

  - **Transcribed** — a `text/data-table` from-to list where the drawing is legible enough to
    trace endpoint to endpoint. This is the goal, because it is the only rendering a claim can
    cite at full strength.
  - **A figure** — the body-empty `image` marker plus that marker's own `description:`, where the
    relation currently cannot be faithfully textualized (illegible scan, a topology the
    from-to shape cannot hold, a sheet nobody has read yet). Honest, and valid indefinitely.

  What the contract DOES bind is that the two never double up: where the from-to rendering
  exists it **supersedes** the marker at that address, because the marker extracts nothing and
  keeping both renders the region twice (§4.3.2.2 — two segments on one region are earned only
  where they extract genuinely DIFFERENT information, which is rare). So `embed_rendered` asks
  each member in the span for one or the other, never for both and never specifically for the
  table. The drawing's provenance rides the address either way: the attested member row is the
  asset, and a transcription's own `bbox=` is the crop into it.

  A drawing whose payload is NOT a relation — a component photo, an exploded parts view, a
  torque plate, a location illustration — is not a schematic at all; that page is a
  `form/document`, where a figure marker and a sub-region transcription legitimately coexist
  because they address different regions.

  Reversal note (2026-07-26): `form/document` previously ruled that "the schematic
  topology of a drawing is NOT losslessly textualizable and gets no fabricated
  transcription". The owner's ruling reverses it — tracing a drawn connection is
  TRANSCRIPTION, the tuple is on the page and is read the same way a printed grid's cell
  is read. What the old prose correctly refused was FABRICATION: a connection the drawing
  does not show. That refusal survives here as the second boundary, below.
extended_fields:
  off_page_references:
    type: list
    required: false
    description: |
      The printed labels of endpoints that are sheet pointers rather than components
      (`Data Communication Schematics`), verbatim as drawn. The relation table cannot
      express this distinction without inventing a column, but the drawing makes it
      plainly — an off-page reference is drawn as a bracketed label, a component as a
      box. This is the surface that stitches sheets into one graph mechanically, with no
      inference.
decomposition: |
  The pairing obligation is **address-keyed**, so the form binds correctly at either
  scope, and the scope is chosen by where the sheets' names are printed. A page carrying
  ONE sheet takes the form at record scope. A multi-sheet page takes **one span section
  per sheet** where the page prints a heading for each (that heading is the span's
  `title:` — §4.3.2.1's designated home, and the sheet's identity then sits on a citable
  surface rather than inside a figure description); mind the consequence, since sections
  never nest — span sections leave the record with no whole-record header, so a record
  whose vouch lives there needs it relocated to the frontmatter override (§4.2.1) as a
  verbatim move, never a re-authoring. Where the page prints no per-sheet headings, keep
  one record-scope section: the check binds each member, so it works either way.

  Each sheet decomposes into ONE segment — whichever of the two renderings applies. Where the
  relation is legible that is a `text/data-table` from-to list, addressed as a `bbox=` crop
  into the sheet's own address (`el=N&bbox=x,y,w,h`), carrying one row per relation the drawing
  states; the address is the transcription's provenance, naming the asset and the region of it
  that was read. Where it is not, that is the `image` marker at the sheet's own address, and
  the reason belongs on that marker's `description:` or a `partial-content` issue — never a
  half-transcription that quietly drops what could not be read.

  The `bbox=` grammar is `x,y,WIDTH,HEIGHT` as **fractions of the image** (`0,0,1,1` is the
  whole sheet) — a pixel-valued bbox does NOT resolve, so resolve every address you write and
  read it back before you trust it.

  Address the DRAWING, not the page. Where the capture baked a viewer's own controls into
  the image — the AllData sheets carry a column of navigation icons at the top right — get
  rid of them with `cover=`, which paints a region out with the sampled local background
  and leaves the frame intact. Prefer it to cropping them off: a crop only works when
  nothing real shares the chrome's x-range, and on a wide drawing the sheet's own labels
  usually do at some other height.

  Where ONE sheet image carries several independent circuits (they share devices but no
  drawn conductor), each is its own segment at its own crop — and `cover=` the neighbours
  before cropping, so a circuit's surface holds only its own content. Without that, each
  crop leaks fragments of the drawing beside it and the provenance stops being exact.

  Make the address EXPLICIT. State the crop even when it is the whole frame
  (`bbox=0,0,1,1`) rather than leaning on an implied full-image default: the address is the
  claim about what was read, and a reader should not have to know a default to know what
  the claim is. Measure every region per sheet with a crop; never assume a constant.

  Columns are the harness-industry ones — from component, from cavity, to component, to
  cavity, circuit, colour, and any direction/terminal marking the drawing prints — cells
  verbatim in the source's own identifiers, plus an option/device-code column where the
  sheet gates branches by build code. See the `text/data-table` overlay's graph-shaped note
  for the fill discipline.

  The attested embed keeps the LOSSY half on its `description:` — layout, symbol glyphs,
  sheet chrome. Discrete printed matter that is not part of the relation — a legend, a note
  block, a connector table — is its own segment at its own region, exactly as under
  `form/document`.

  Two boundaries are normative to this contract. **Geometry is not relation content**:
  where a box sits on the sheet, and the sheet's chrome, stay with the figure marker's
  `description:`;
  the table carries the relation only. **An unshown connection is an inference**:
  transcribe the printed termination even when the downstream one is obvious — a conductor
  the drawing does not draw belongs to the ledger as a claim over this segment's span,
  never to a cell.
checks:
  address_axes: [el, page, pages, block]
  embed_rendered:
    lossless: text/data-table
    marker: image
normalization:
  guidance: |
    Read the drawing from the resolved bytes — never transcribe a sheet from its own
    description or from a sibling record's. On a dense sheet, read the whole sheet once for
    topology, then **crop-and-upscale every region you are not certain of** and read it
    again (`?el=N&bbox=x,y,w,h&resize=WxH`, bbox fractional): a plausible-looking reading
    of a junction, an internal jumper, or a two-digit cavity is exactly the error this
    contract exists to catch, and it costs one resolver call to settle. Work endpoint to
    endpoint: one row per
    conductor segment between two termination points, so a wire passing through a
    connector or an inline splice yields a row on each side of it rather than one row that
    silently swallows the connector.

    Cells are verbatim. An identifier the sheet does not print is an EMPTY cell, not a
    guess and not a borrowed value from a sibling sheet (an unnumbered coax terminal stays
    unnumbered). Where a label is present but unreadable, write
    `[unclear: <best guess>]` and persist a `partial-content` issue naming the cell —
    never drop the row, and never drop a row because its circuit number is missing.

    Know when to stop and leave it a figure. If the drawing will not yield its relation —
    a scan too degraded to trace, a topology the from-to shape cannot hold — the honest
    rendering is the marker plus a described embed, with the reason recorded. A table
    reconstructed past what the bytes support is worse than no table at all: it reads as
    transcription and cites at full strength, so an invented row is laundered into
    authoritative evidence. Half a sheet transcribed with the illegible half silently
    absent is the same failure wearing a better coat.

    **Resolve every address you write and read it back.** A transcription's `bbox=` is not a
    caption — it is the claim about which bytes were read, and it is the only provenance the
    table has. Writing one without resolving it is how a whole fleet ended up carrying
    addresses that materialize nothing; the check costs one call and it also proves the crop
    you transcribed is the crop you addressed. `corpus lint <id> --resolve` does the
    mechanical half — it materializes every address the record stores and fails the ones that
    resolve to nothing — but it cannot tell you a well-formed crop is the WRONG region. Only
    your eyes on the resolved image do that, so run both: the gate, and the look.

    **The description is the LAST thing you write.** Not "late" — last. Do not draft it, do
    not sketch it, do not carry a sentence for it in your head while transcribing: the whole
    rule is that it carries only what the rendering does not, so until the body is final and
    checked you cannot know what that remainder is. Written any earlier it describes a body
    that no longer exists — and nothing catches the drift, because a description is prose no
    gate can verify. The correct order is: read the bytes → author the rendering → resolve
    every address you wrote and read it back → lint clean → and only THEN look at what is
    left over and write the line. If you find yourself writing description prose before the
    last row is settled, you are describing an intention rather than a record.

    **The placing segment's `description:` carries only what the chosen rendering does not**,
    and the two branches are lopsided:

    - Transcribed → ONE LINE. Name the sheet, and disclose what the address covered out.
      Nothing else: the relation is in the table at full strength, and a description can
      only ever cite at `kind: incidental` (`ledger.md` §13.2), so narrating connectivity
      buys nothing and rots independently — correct a row and the prose beside it silently
      goes stale. No element lists, no tracing, no restating the table in sentences.
    - Figure-only → the description IS the rendering, so it is full and careful: what the
      sheet draws, its layout, its symbol conventions, and WHY the relation could not be
      transcribed, so the next pass inherits the judgment instead of re-deriving it.

    Do not leave it empty in either branch. An undescribed image embed raises
    `embed-description-empty-on-normalized`, and silencing that with a persisted
    "intentionally undescribed" issue is more ceremony than the one line it replaces.

    If a correction later changes the body — a row re-read, a crop re-measured — the
    description is re-derived from the new remainder, never patched around the edit. It is
    downstream of the rendering, so it is rewritten with it.

    The acceptance test is regeneration: a sheet redrawn from the table plus the ledger's
    facts should be ELECTRICALLY identical to the original — same endpoints, same
    cavities, same circuits — though never pixel-identical, since geometry deliberately
    does not survive into the relation. A mismatch is a finding to investigate, in either
    direction: a transcription error, or a fact that outran its evidence.
