form_id: article
kind: form
description: |
  Prose-led reading matter (spec §7.8): a piece written to be READ — heading-structured
  paragraphs carrying an explanation, description, notice, or account, with any figures
  or tables ATTENDING the prose rather than being the payload. Names a SHAPE, never a
  subject: a system-operation description, a service precaution, a policy page, an
  encyclopedia entry, and a blog post all wear it. The boundary against `form/document`
  is which way the dependency runs: in an ARTICLE the prose is the content and
  figures/tables illustrate it; in a DOCUMENT the figures/tables/plates ARE the content
  and prose frames them. The boundary against `form/procedure` is imperative structure:
  steps meant to be performed in order are a procedure, prose meant to be understood is
  an article. A **tracked advisory** — a numbered, dated, superseding notice; a TSB, a
  recall, a safety or security bulletin — is an article too, and its identity block
  (number, date, supersession line, campaign id) is prose the body carries verbatim like
  any other. It had its own contract until 2026-07-28; spec §12.31 retired that contract
  because its envelope fields only ever restated lines the body already printed, and
  because which bulletin supersedes which is a ledger claim citing those lines, never a
  record's assertion about itself. Host-specific advisory tactics live on the origin
  overlay (§7.2).
extended_fields: {}
decomposition: |
  The span renders the piece's own structure faithfully: the source's headings as
  markdown headings inside text segments, paragraphs verbatim, lists as lists. A figure
  that is a MEMBER (its own transport inside this one) arrives as a **placement** at the
  source's own position and carries no claim whatever — what that figure is belongs to
  the member's own record (§4.3.2.4, §12.30). A region of THIS record's transport — a
  rastered page, a `bbox=` crop — keeps its content-atom marker, with any lossless
  `text/ocr` / `text/data-table` transcription beside it at the same address. An
  in-prose data table renders as `text/data-table`. No summary, no inferred context, and
  the links the source DOES carry are kept — an `<a href>` in the prose is body content
  (§4.3.2.2). Addressing rides the record's native axes (`el=` for web drafts, `pages=`
  for paginated sources).
checks:
  address_axes: [el, pages, page, line]
normalization:
  guidance: |
    Render the prose faithfully and completely — no paraphrase, no editorial summary in
    the body, specifics never smoothed away (an "always/never" clause, a voltage or
    torque caution, a warranty condition survives verbatim). Promote the source's own
    subsection headings; do not invent structure the source lacks. Short single-block
    pieces (a precaution notice) stay flat.

    This form declares no `extended_fields`, so its opener is BARE — `<!--section
    article-->` and nothing else — and that is complete (spec §4.3.2.1). Do not write
    `title:` or `description:` on it: the universal section-header fields retired in 3.5
    and the count of them is now zero. What the piece is *about* is not the record's to
    say; a synopsis is a ledger claim citing the span.

    A tracked advisory (TSB, recall, safety notice) is an ordinary article here. Carry
    its identity block — bulletin number, date, supersession line, campaign id — VERBATIM
    in the body, never normalized and never lifted into a header field: a ledger
    `bulletin_ref` claim quotes those lines to cite them, so a tidied number breaks the
    quote. A supersession stub whose whole body is the printed forward-reference is a
    complete rendering of a short page, not a failed pass.
