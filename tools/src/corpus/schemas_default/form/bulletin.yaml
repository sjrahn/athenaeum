form_id: bulletin
kind: form
description: |
  A numbered, dated, tracked advisory document (spec §7.8): an issuer's formal notice
  carrying its own identity envelope — a bulletin/advisory number, an issue or revision
  date, often a supersession lineage and a regulator's campaign id — plus an
  applicability statement and an advisory body (typically condition/concern → cause →
  correction/recommendation). Technical service bulletins, recall and service-campaign
  notices, safety advisories, security bulletins all wear it. Names a SHAPE, never a
  subject or an issuer: WHICH manufacturer, WHICH vehicles, WHICH campaign are the
  ledger's concerns, harvested from the envelope and the body — never asserted here.
  The boundary against `form/article`: the tracked advisory envelope is the contract —
  a numbered, dated, superseding notice is a bulletin even when its body reads as
  prose.
extended_fields:
  bulletin_no:
    type: string
    required: true
    description: |
      The issuer's own bulletin/advisory number, verbatim as the document prints it
      (e.g. "09-06-03-004D"). Mechanically derivable from the span's own bytes.
  bulletin_date:
    type: string
    required: false
    semantic_type: timestamp
    description: |
      The bulletin's issue/current-revision date as printed. Absent means the document
      itself prints none, never unknown-unstated.
  supersedes:
    type: string
    required: false
    description: |
      The prior bulletin number this document declares it supersedes/replaces, verbatim
      from the document's own supersession line. Absent when the document declares none.
  campaign_id:
    type: string
    required: false
    description: |
      A regulator's campaign identifier the document carries (e.g. an NHTSA campaign
      number on a recall), verbatim. Absent when the document names none.
decomposition: |
  The span carries the bulletin faithfully: the identity block (number, date, any
  supersession line, any campaign id, subject line) verbatim in the body — the envelope
  fields RESTATE it, they never replace it; the applicability/affected-models table as
  `text/data-table` (a literal HTML `<table>` where merged headers demand it); the
  advisory body with the source's own headings (Condition/Concern, Cause,
  Correction/Recommendation, warranty information) preserved; figures as described
  embeds; any inline repair steps rendered with procedure discipline (order and inline
  cautions intact).
checks:
  envelope_required: [bulletin_no]
  address_axes: [el, pages, page]
  monotonic: true
normalization:
  guidance: |
    The identity envelope is the harvest surface — carry `bulletin_no` (and date /
    supersedes / campaign id where printed) verbatim onto the section header AND keep
    the printed lines verbatim in the body so span-precise citations land on the
    document's own words. Never normalize an issuer's number format. The
    affected-vehicles table transcribes cell-exact.

    On a whole-record span, the section header's `title:`/`description:` fields are the
    vouch's home (implicitly role-marked, spec §4.2.3/§4.3.2.1) — never the frontmatter.
    Title from the bulletin's own subject/title; the description is a genuine synopsis:
    who issues it, what condition it addresses, what it instructs, what it applies to,
    and its lineage (supersedes / superseded-by where the document states it).
