# Universal issue-block fields — applied to every `issue`-namespace context block
# (<!--context issue/<id>-->) regardless of issue type. Per-type extensions live at
# context/issue/<id>.yaml; subtype-specific at context/issue/<id>/<subtype>.yaml.
#
# See spec/corpus.md §4.3.3 (context block) and §4.3.3.1 (the issue namespace).

description: |
  Universal fields every issue carries on its <!--context issue/<id>--> block, regardless
  of issue type. Per-type yamls in this directory extend with id-specific fields.

applies_at: [record, segment]

extended_fields:
  severity:
    type: string
    required: true
    enum: [blocking, warning, info]
    description: |
      The issue's severity. Closed enum: `blocking | warning | info`.
      - `blocking` — the issue prevents downstream use of this content.
      - `warning` — the issue affects fidelity or interpretation but does not block use.
      - `info` — informational observation, no remediation expected.
      A corpus may extend this `enum:` in its local `context/issue/issue.yaml`; lint
      validates against the schema-declared set, not a hardcoded vocabulary.
      There is deliberately no `resolution` field (retired v42, spec §4.3.3.2): an issue
      is a lifecycle-free attestation — dropped by its emitting pass when the fact stops
      being true, never marked fixed. Fixable findings are report material for the
      instance tracker (Part I §2.3), never blocks.
  detector:
    type: string
    required: true
    description: |
      Touch identifier of the pass that emitted the issue (e.g. `corpus.draft.html@1.0.0`,
      `claude-opus-4-7[1m]`). Provides provenance — which pass detected this problem.
  address:
    type: string
    required: false
    description: |
      Optional segment address. Presence makes the issue segment-scoped (refers to a
      specific segment in the content zone); absence makes it record-scoped (applies to
      the artifact as a whole). Replaces v0.3's segment-header inline `issues:` arrays.
