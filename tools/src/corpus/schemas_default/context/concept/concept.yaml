# The `concept` context namespace — a concept (an entity, idea, work, place, …) that a record's
# body invokes, captured as an annotation resolved against an EXTERNAL local knowledge base
# (Wikipedia / Wikidata), NOT a corpus record (spec §4.3.3.4). Wikipedia is run locally and read
# in place; the corpus never captures its articles, it only references them by id/URL.
#
# Emitted as `<!--context concept-->` in the annotations zone. Scope carries the distinction:
# a SEGMENT-scoped block (with `address`) is a *mention* at a span (the YouTube-style chip case);
# a RECORD-scoped block (no `address`) is *aboutness* for the whole artifact. Normally
# normalizer-/human-asserted (no `provenance`); an auto-annotation pass may seed `provenance: auto`.
# Never part of the faithful body or the canonical hash.

description: |
  A concept the body invokes, resolved against the local Wikipedia/Wikidata knowledge base. It
  rides the same lossy→lossless identity ladder as a citation (§4.4.5): label → url → concept
  (the stable canonical id). The `address` (+ optional `quote`) pins a mention back to the exact
  span; an `address`-less block records that the record as a whole is *about* the concept.

applies_at: [record, segment]

extended_fields:
  # ---- anchor: where in the record the concept is invoked ----
  address:
    type: string
    required: false
    description: |
      Segment address of the mention. Presence makes the concept block segment-scoped (a *mention*
      at a span); absence makes it record-scoped (*aboutness* for the whole artifact). The coarse
      anchor; `quote` sharpens it to the exact phrase.
  quote:
    type: string
    required: false
    description: |
      Verbatim span copied from the segment body where the concept is invoked — the exact phrase
      ("the second law of thermodynamics"). Stable across redrafts because the body is an immutable
      rendering of the immutable artifact; preferred over character offsets.
  occurrence:
    type: integer
    required: false
    description: |
      1-based index disambiguating which match, when `quote` appears more than once in the
      addressed segment. Omit when the quote is unique.

  # ---- the concept identity ladder (mirrors §4.4.5), lossy → lossless ----
  label:
    type: string
    required: false
    description: |
      Tier 1 — the concept's display name, the human-facing title of the chip ("Second law of
      thermodynamics"). Always safe to record first, even before the concept is resolved.
  url:
    type: string
    semantic_type: uri
    required: false
    description: |
      Tier 2 — a resolvable URL for the concept (its Wikipedia article). Aggregated into the `uris`
      derived view (§9.3). Omitted for a corpus-local concept that has no external page.
  concept:
    type: string
    semantic_type: identifier
    required: false
    description: |
      Tier 3 — the stable canonical id, the join key that links artifacts invoking the same concept
      without either knowing about the other: `wikidata:Q<n>` (preferred, version-stable),
      `enwiki:<Article_Title>` (a ZIM article when no QID is resolved), or `local:<slug>` (a
      corpus-local custom concept, §C). Aggregated into the `identifiers` derived view (§9.5).
