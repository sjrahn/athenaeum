description: |
  A single RFC822 / MIME email message — one headers-plus-body unit. Typically **promoted**
  from an mbox container (`corpus://<mbox-id>?msg=<N>`, spec §8.1 / §12.11), its bytes never
  leaving the mailbox; or ingested standalone as an `.eml` (detected by header shape, §12.3.2).

  The mechanical drafter (`draft/eml.py`) does three things:

  1. **Headers → the artifact block** (RFC2047-decoded, single-line, empty ones omitted):
     `subject` (also the `title` candidate), `from`, `to`, `cc`, `bcc`, `date`, `message_id`,
     `in_reply_to`, `references` (a YAML list of message-ids in file order), and `thread_id`
     (Gmail `X-GM-THRID`, when present). Thread reconstruction is a frontmatter query:
     `references` / `in_reply_to` ↔ `message_id` joins across sibling records; `thread_id`
     groups them. The drafted body carries NO headers block.

     The recipient headers (`to`, `cc`, `bcc`) are string-or-list: split per mailbox — a
     str for one recipient, a str[] for several (a comma inside a quoted display name is
     never a split point).

  2. **Body = the reply text only.** It renders the `text/plain` part (else the `text/html`
     part reduced to text — with `.gmail_quote` / `.gmail_extra` / `.yahoo_quoted` / `blockquote`
     reply containers removed) and then mechanically trims trailing **quoted history** from the
     FIRST confidently-matched marker to EOF (the prior thread lives as its own records; the raw
     bytes retain everything). Markers, conservative and deterministic — prefers false negatives,
     keeping everything when none matches: an `On <…> wrote:` attribution (one line or wrapped
     over two) directly preceding a `>`-quoted line; `-----Original Message-----`; a long
     underscore rule; an Outlook forwarded-header block (`From:` with a nearby `Sent:` and
     `To:`/`Subject:`); or a `>`-quoted run extending to EOF. Signatures precede the quote and
     are kept. The normalizer refines edge cases the mechanical pass left.

  3. **Every non-body MIME part → an embed** addressed `part=<N>` (attachments, inline images,
     nested messages). The text alternatives the body consumed are skipped (they are content,
     not members). Each declared part is **promotable** (§8.1) — a contract PDF attachment
     becomes a first-class `application/pdf` record whose bytes never leave the message. Because
     these embeds are message members (not body-flow assets a mechanical pass can position), the
     `embed-unreferenced` lint is relaxed for a message/rfc822 record — the normalizer links an
     inline image into the body when it belongs there.
applies_to:
  content_types:
  - message/rfc822
# whole-address admissibility: one message.
whole_address: admissible
mode: body-draft
# Resolver's initial working kind: `part=<N>` materializes a MIME part's decoded bytes
# (`transforms/message.py`).
working_kind: message
address_scheme:
- param: part
  type: integer
  description: |-
    `part=<N>` — the 1-indexed Nth **addressable part** in depth-first pre-order (every leaf
    part, plus every nested `message/rfc822` counted as a whole, not descended into; multipart
    containers get no ordinal), materialized as its **CTE-decoded** payload bytes (identity is
    the decoded bytes, not the base64/QP transfer text). The address the eml drafter records on
    each non-body part's embed; round-trips to byte-identical content via `transforms/message.py`.
    A terminal `part=<N>` on a **textual** part (`text/plain`, `text/html` — the declared
    Content-Type, decoded per its declared charset) prints as text, per §6.2's member
    re-chaining rule — so `?part=<N>` on the text/plain alternative is a citable, verifiable
    surface for the whole body (forwarded history included — `block=1` deliberately trims
    it); a `text/html` part chains on into the HTML pipeline — `part=<N>&text` reduces it to
    its text (the citable surface of an HTML-only message, §6.2), `part=<N>&el=<M>` names an
    element, and an `<img src="cid:…">` in it materializes through THIS message (§6.2
    intra-container references) — every other part stays its raw bytes. Engine-pinned
    `eml-part@1`.
- param: header
  type: string
  description: |-
    `header=<name>` — one header of the message as text (spec §6.2, v43): RFC 2047-decoded,
    folded onto a single line, a repeated header newline-joined in file order; name is
    case-insensitive (`subject`, `from`, `to`, `cc`, `date`, `message-id`, `in-reply-to`,
    `references`, …). The envelope's own facts as a span-precise, verifiable citation
    surface — `msg=<N>&header=subject` on the mailbox itself — without promoting the
    message; the same values the promoted record lifts to its artifact block. A header the
    message does not carry is an error. Engine-pinned `eml-header@1`.
# (3.2) `subject` is the artifact's own honest title-shaped fact (the RFC2047-decoded
# Subject: header) — role-marked so a message derives a display title with no LLM pass.
# The drafter ALSO writes a redundant `title` field (an exact copy of `subject`, the
# pre-3.2 title-authoring shortcut, see `draft/eml.py`); it stays undeclared/unmarked here
# rather than doubly-marking the same value under two names. The normalization guidance's
# `<clean subject> — <sender> (<date>)` shaping (thread-sibling disambiguation) remains an
# origin/form-layer concern this artifact-layer mark doesn't preempt — it's the weakest
# layer in the §4.2.3 precedence, so a stronger candidate still wins when one exists.
extended_fields:
  subject:
    type: string
    required: false
    role: title
    source: file_metadata
    description: RFC2047-decoded `Subject:` header, single-line. Repeats across a thread (`Re:`/`Fwd:` chains) — not unique among siblings, but honestly the message's own title-shaped fact.
  from:
    type: string
    required: false
    source: file_metadata
    description: RFC2047-decoded `From:` header, single-line. Omitted (per-message) when the header is absent.
  to:
    type: string-or-list
    required: false
    source: file_metadata
    description: |-
      RFC2047-decoded `To:` header — a string for one recipient, a string list for
      several (a comma inside a quoted display name is never a split point). Omitted
      when absent.
  cc:
    type: string-or-list
    required: false
    source: file_metadata
    description: Same shape as `to`, from the `Cc:` header. Omitted when absent.
  bcc:
    type: string-or-list
    required: false
    source: file_metadata
    description: Same shape as `to`, from the `Bcc:` header (rarely present in captured mail). Omitted when absent.
  date:
    type: string
    semantic_type: timestamp
    required: false
    source: file_metadata
    description: RFC 5322 `Date:` header, verbatim. Omitted when absent.
  message_id:
    type: string
    required: false
    source: file_metadata
    description: The `Message-ID:` header, verbatim (including angle brackets) — what sibling records' `references`/`in_reply_to` join against.
  in_reply_to:
    type: string
    required: false
    source: file_metadata
    description: The `In-Reply-To:` header, verbatim — the immediate parent's `message_id` in a thread.
  references:
    type: list
    required: false
    source: file_metadata
    description: The `References:` header, split into a YAML list of message-ids in file order (oldest first).
  thread_id:
    type: string
    required: false
    source: file_metadata
    description: Gmail's `X-GM-THRID` header, when present — groups sibling records into one thread independent of the `references`/`in_reply_to` chain.
normalization:
  method: refinement
  guidance: |
    One email message — usually one turn of a larger conversation. The mechanical draft is
    already close to final (headers on the artifact block, reply-only body in one text
    segment, every non-body MIME part a `part=` embed), so the pass is refinement, not
    reconstruction.

    ## Read the thread first

    A single turn rarely explains itself. Reconstruct the conversation from the frontmatter
    joins the drafter laid down: `thread_id` groups sibling records, `references` /
    `in_reply_to` ↔ `message_id` orders them, `date` breaks ties. Read every sibling record
    so the structural work below (quote-trim verification, attachment placement) is made
    with the thread's context in view. Not every referenced message has a record — a gap in
    the chain is context you may still recover from the raw bytes' quoted history (resolve
    the record id).

    ## There is no title or description to author

    Both are derived, never authored (spec §4.2.3) — there is no frontmatter field this
    pass writes to. The record's display title resolves from the `subject` role mark above,
    honestly ambiguous among thread siblings (subjects repeat across `Re:`/`Fwd:` chains) —
    a fact about the source, not a defect. Where the promoting origin overlay (the mbox
    producer, or a standalone-eml capture path) declares an `editorial.title_template`
    composing `subject` with sender/date, that mechanical composition — not this pass — is
    what disambiguates siblings (spec §4.2.3); if none is declared and the population would
    clearly benefit, say so in your report rather than writing a title by hand. What this
    message is DOING in its thread (asks, answers, confirms, declines, attaches — the move,
    with its particulars) is a ledger claim citing the record and its thread, never a
    record-side summary.

    ## Body

    The drafter's quoted-history trim is deliberately conservative (false negatives keep
    everything). Remove residual quoted history it missed — verify against the raw bytes
    when the cut looks doubtful; the prior turns live in their own records and in the
    artifact, never twice in one body. Keep signatures. Keep terse bodies: a two-word reply
    is usually the genuine message, not a defect. Whitespace and wrap cleanup is fine;
    adding or paraphrasing content is not (§1.5 principle 3).

    Do NOT put `entry:` on the body segment, or anywhere else in this record — the field
    retired from both section and segment headers in 3.5 (spec §4.3.2.1/§4.3.2.2), and a
    single-body message record needs no TOC unit at all: the derived TOC is empty for a
    record with no structural marks, which is the honest, complete shape here.

    ## Attachments and inline images

    Attachments are message members — rows of the record's `<!--members-->` block, wholly
    attested and carrying no `description` of their own (spec §4.3.1.4), and neither does
    the placing segment (retired 3.5, spec §4.3.2.2 — a segment cannot narrate its own
    region). A member is placed only where a segment PLACES it: link an inline image into
    the body (a body-empty `image` segment at its `part=` address, permanent) when the
    author is SHOWING it as part of the message flow. Resolve `corpus://<id>?part=<N>` and
    view the bytes first; where a region is losslessly transcribable (printed text in the
    image), emit a sibling `text/ocr` segment — otherwise the marker alone is the complete
    rendering. Signature logos, banners, and tracking pixels stay unplaced
    (`embed-unreferenced` is relaxed for this mime), which is correct: filename/MIME/size
    are already on its row, and anything deeper belongs on the member's own record after
    promotion (§8.1), never narrated here.

    Surface faithfulness problems as issue blocks in the annotations zone; set
    `status: normalized`.
