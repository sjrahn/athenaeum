description: |
  vCard — the address-book contact interchange format (RFC 6350 / RFC 2426). One delivered
  `.vcf` file holds N contact cards (`BEGIN:VCARD … END:VCARD`) and is a **manifest** container
  (§7.1; the disposition follows from the `vcard-manifest` strategy): each card is a
  content-addressed `text/vcard` **member** embed at `card=<N>` (1-indexed card order),
  delimiter-pinned and **promotable** to its own record (§8.1) without its bytes leaving the file.

  **Why a manifest, not the 2.x `el=` text segments.** Through ATH-CORPUS 2.x this stayed one
  record whose cards were `el=`-addressable TEXT SEGMENTS of a faithful labeled body. 3.0 retires
  that per-card `el=` drafting: a downstream ledger consumer (the cross-platform "identity-v2"
  linking pass) cites an INDIVIDUAL card, and a manifest embed is promotable where a text segment
  is not — a cited card becomes its own first-class `text/vcard` record (origin =
  `corpus://<file>?card=<N>`) with its bytes still resident in the `.vcf`. So the card is the
  manifest member, and the labeled per-property rendering the 2.x drafter wrote is now a
  read-time `body`-derivation / normalize concern, never the attested layer.

  **Attest (ingest / reattest) — eager, complete, byte-exact.** ONE `text/vcard` member row per
  card at `card=<N>`. Unlike an mbox (10^5 messages → selective `--messages` declaration,
  §12.11), a `.vcf` is small, so ALL cards attest **eagerly** — no mbox-style selectivity. Each
  row's `transport` is the blake3 over the card's EXACT member bytes (the verbatim byte span from
  the `BEGIN:VCARD` line start through the `END:VCARD` line end incl. its terminator — pinned in
  `corpus.vcardfile`, the mbox precedent on the contact axis), and `bytes` its length. The card's
  display name (FN, else a formed N, else ORG / NICKNAME / EMAIL / TEL — the 2.x fallback chain)
  is **stored nowhere**: 3.4 closed the row to four keys, and the display name is read on demand
  from the `members` derivation (`corpus resolve "corpus://<id>?members"`, spec §6.2/§12.26).

  **Bytes are verbatim.** A card's member bytes are the raw `.vcf` bytes of its span — folded
  RFC 6350 continuation lines, CRLF-or-LF terminators, and QUOTED-PRINTABLE payloads all
  preserved. RFC 6350 line-unfolding is a READ-time concern of a consumer, NEVER applied to the
  member bytes: identity is bytes (§2). A `card=<N>` resolve (`transforms/vcard.py`) round-trips
  to the byte-identical member the row's `transport` records, and `corpus promote` mints it.

  **PHOTO bytes stay inside the card.** An embedded-bytes `PHOTO` (`ENCODING=b`, or an inline
  `data:` URI) is part of its card's member bytes and is NOT lifted to a separate image embed at
  attest (the 2.x drafter DID lift it to an `image/*` embed; that behavior now belongs to
  normalize/annotation if a describe pass wants the face). This keeps a card one promotable
  transport. A `PHOTO` whose value is an external URL is likewise just card bytes.

  Parse-tolerant per house doctrine: a malformed card (a `BEGIN:VCARD` with no matching
  `END:VCARD` before the next `BEGIN`/EOF) is skipped and counted in a `partial-content` issue,
  never failing the whole file. What a contact MEANS (who the person is, their relationships) is
  ledger knowledge, never a record assertion (ATH-CORPUS 2.0).
applies_to:
  content_types:
  - text/vcard
# whole-address admissibility: a vcard FILE may carry many cards; `card_count` is already attested.
whole_address: single_unit_only
whole_address_count: card_count
# Resolver's initial working kind for the functional-URI pipeline: `card=<N>` materializes one
# card's exact member bytes (`transforms/vcard.py`).
working_kind: vcard
draft:
  strategy: vcard-manifest
address_scheme:
- param: card
  type: integer
  description: |-
    `card=<N>` — the 1-indexed Nth card's exact member bytes as `text/vcard` (the `BEGIN:VCARD`
    line start through the `END:VCARD` line end incl. terminator, verbatim). The address the
    `vcard-manifest` drafter records on each card's embed; round-trips to byte-identical content
    via `transforms/vcard.py`, and is the promotion address (§8.1). Ordinals count only the
    successfully-delimited cards in file order (a skipped malformed card leaves no ordinal).
normalization:
  method: refinement
  guidance: |
    This guidance applies to every normalize pass over a `text/vcard` record — a delivered
    address-book export (`.vcf`), a **manifest** record whose N contact cards are `text/vcard`
    member embeds at `card=<N>`. The drafter is mechanical and its attestation is already
    faithful and lossless; the normalizer's job here is small and mostly frontmatter.

    ## What the drafter already did — leave it alone

    - Emitted **one `text/vcard` member row per card** at `address: card=<N>` (1-indexed card
      order), `transport:` = the blake3 over the card's exact member bytes, `bytes:` its length.
      The display name is not stored — read it from the `members` derivation. The content zone is
      **empty** — the cards ARE the manifest (the members), not body-flow content. Do NOT invent
      body segments.
    - Recorded `card_count`, `vcard_version`, and (when uniform) `product_id` on the artifact
      block. A malformed card is skipped and counted in a `partial-content` issue — preserve it.

    Do NOT re-address, merge, or drop card embeds; card identity is byte-exact. A card that a
    downstream ledger pass wants to cite is **promoted** to its own `text/vcard` record
    (`corpus promote corpus://<file>?card=<N>`) — that promoted record normalizes on its own.

    ## `description` — the summary surface

    Write a faithful 1–3 sentence frontmatter `description` in a single physical line: name the
    source (the origin overlay says which — an iCloud/Apple contacts export, a Google Contacts
    Takeout slice), the contact count (`card_count`), and the vCard version (`vcard_version`).
    Stay faithful — describe what the file IS, not who the contacts are.

    ## `title`

    Author a frontmatter `title` from the origin: the export source + count, e.g.
    "iCloud contacts export — 150 contacts" or "Google Contacts (All Contacts) — 621 contacts".

    ## Embedded photos — deferred

    An embedded-bytes `PHOTO` stays inside its card's member bytes (not lifted at attest). If a
    describe pass ever wants the face, that is a normalize/annotation concern on the promoted
    card's own record — not this manifest. Real exports so far carry photos as external URLs, so
    no record needs it yet; the bytes are never lost (they are in the card's `transport`).

    ## Privacy — this is (typically) a private personal corpus

    Names, phone numbers, emails, addresses, birthdays, and notes are the CONTENT. They are in
    the cards' verbatim bytes; do NOT redact, mask, or placeholder. Derived sensitivity is a
    ledger/consumer concern, never a partition here.

    ## Verification

    - `description` is a single physical line, populated.
    - Every card is one `text/vcard` embed addressed `card=<N>` in card order; the content zone
      is empty. Drafter-emitted issues (skipped malformed cards, empty file) are preserved.
extended_fields:
  card_count:
    type: integer
    required: false
    source: file_metadata
    description: Number of successfully-delimited `BEGIN:VCARD … END:VCARD` cards (skipped malformed cards excluded); equals the count of `card=<N>` embeds. A fact about the bytes.
  vcard_version:
    type: string_or_list
    required: false
    source: file_metadata
    description: The `VERSION:` value(s) the cards declare (`3.0` for Google + Apple exports). A string when uniform across the file, a list when the file mixes versions.
  product_id:
    type: string
    required: false
    source: file_metadata
    description: The `PRODID:` value the cards declare (e.g. `-//Apple Inc.//iOS 26.2//EN`) — the exporting software, verbatim. Surfaced ONLY when uniform across the whole file; a long-lived address book whose contacts were last touched by many exporter versions (each card records its own PRODID) carries several, which are per-card provenance, not a file fact, and are omitted here.
