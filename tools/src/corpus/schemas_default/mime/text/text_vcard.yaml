description: |
  vCard — the address-book contact interchange format (RFC 6350 / RFC 2426). One delivered
  `.vcf` file holds N contact cards (`BEGIN:VCARD … END:VCARD`), and stays ONE record: each
  card is an `el=`-addressable SEGMENT of the file, never its own record (a downstream ledger
  cites an individual contact by its segment address, `corpus://<hash>?el=<N>`). The drafter is
  purely mechanical: it UNFOLDS RFC 6350 continuation lines, splits the stream into cards, and
  emits one `<!--segment text-->` per card at `el=<ordinal>` (1-indexed block order) whose body
  is a faithful labeled rendering of every property the card carries (group prefix, name,
  parameters, and value preserved verbatim — a reader reconstructs the card's data), with the
  card's display name (FN, else a formed N, else ORG/EMAIL/TEL) on the segment `entry:` so
  `corpus toc` reads as a contact directory. An embedded-BYTES `PHOTO` (`ENCODING=b`/`BASE64`,
  or an inline `data:` URI) is lifted to a content-addressed `<!--embed image/*-->` (dedup'd by
  transport) with a body-empty `<!--segment image-->` positioning marker at the card's `el=` —
  the HTML inline-data-URI precedent; the megabytes never sit in the body and the bytes are
  never dropped (the transport hash + the retained artifact keep them). A `PHOTO` whose value is
  an external URL (Google Contacts exports every photo this way) is NOT an embed — it renders as
  a faithful labeled field. Parse-tolerant per house doctrine: a malformed card is logged as an
  issue and skipped, never failing the whole file. What a contact MEANS (who the person is,
  their relationships) is ledger knowledge, never a record assertion (ATH-CORPUS 2.0).
applies_to:
  content_types:
  - text/vcard
mode: body-draft
artifact_kind: self_contained
address_scheme:
- param: el
  type: integer
  description: |-
    1-indexed position of a vCard in the file, in `BEGIN:VCARD … END:VCARD` block order.
    `el=3` names the third card. Stable across drafter changes because the artifact is
    immutable. A card's text segment (its labeled fields) and its single lifted PHOTO embed +
    positioning marker all share the card's `el=` (distinct segments by opener-id: `text`
    vs `image`).
- param: photo
  type: integer
  description: |-
    Sub-selector disambiguating multiple embedded PHOTOs within one card — `el=3&photo=2` is
    the second embedded photo of card 3. Absent when a card carries at most one embedded photo
    (the common case), where the embed + marker ride the bare `el=`.
embeds:
  media_types:
  - image/jpeg
  - image/png
  - image/gif
  - image/webp
  - image/tiff
  - image/bmp
  description: |-
    One `<!--embed <media-type>-->` block per unique-content EMBEDDED photo (a `PHOTO` property
    carrying its bytes inline — `ENCODING=b`/`BASE64` or a `data:` URI), deduplicated by
    `transport` (the `blake3:<hex>` of the decoded image bytes — the same face reused across
    contacts collapses to one embed with an address list). The opener carries the decoded MIME
    type (from the `TYPE=` param, the `data:` prefix, or a magic-byte sniff). The body never
    carries the base64 — only the metadata; the bytes live in the artifact (the `.vcf` retains
    the base64) and are content-identified by `transport`. A PHOTO whose value is an external
    URL is a labeled field, not an embed.
  fields:
    address:
      type: string-or-list
      required: true
      description: "Card address(es) where these bytes appear (`el=<N>`, or `el=<N>&photo=<K>`). Scalar for a single occurrence, a YAML list when the same face is reused across cards. Same polymorphic shape as Segment.address (spec §4.3)."
    transport:
      type: string
      required: true
      description: "`<algo>:<hex>` content hash of the decoded photo bytes (`blake3:<64-hex>`). The embed's content id and dedup key. Universal embed field per spec §4.3.1.4."
    alt:
      type: string
      required: false
      description: "The source PHOTO parameter set that carried meaning (e.g. the `TYPE=` value), verbatim. Omitted when the property carried none."
transport_algos:
- sha256
normalization:
  method: refinement
  guidance: |
    This guidance applies to every normalize pass over a `text/vcard` record — a delivered
    address-book export (`.vcf`), one record holding N contact cards. The drafter
    (`tools/src/corpus/draft/vcard.py`) is mechanical and its output is already faithful and
    lossless; the normalizer's job here is small and mostly frontmatter.

    ## What the drafter already did — leave it alone

    - **UNFOLDED** every RFC 6350 continuation line and split the stream into cards.
    - Emitted **one `<!--segment text-->` per card** at `address: el=<N>` (1-indexed card
      order), `entry:` = the card's display name, body = a markdown list of the card's
      properties, one per line: `- **[group.]NAME** (params): value`. The property name, any
      group prefix (`item1.`), the parameters (`type=CELL`, …), and the value are preserved
      VERBATIM — including vCard value escaping (`\n`, `\,`, `\;`) and semicolon-structured
      `N`/`ADR` component values. Do NOT paraphrase, re-order, decompose, or "clean up" these
      lines — that is faithful form, and a downstream ledger claim cites the exact span.
    - Lifted any **embedded-bytes PHOTO** to a top-of-body `<!--embed image/*-->` (dedup'd by
      transport) plus a body-empty `<!--segment image-->` marker at the same `el=`. A PHOTO
      whose value is an external URL is left as a labeled field (not embedded).

    Do NOT re-segment, merge, or re-attribute cards; do not strip `entry:` labels. Touch a
    segment only to fix a genuine extraction defect, and note it as an `issue`.

    ## Structure

    This is a flat, sectionless record: one top-level segment per card. That is the right
    shape for a contact directory — do NOT invent sections. When a file carries embedded
    photos, each lifted photo is an extra top-level body-empty `image` marker with no `entry:`;
    the mechanical draft leaves an `entry-missing` advisory on those markers. To finalize such
    a record, give each card its own `<!--section-->` (`entry:` = the display name) wrapping the
    card's `text` segment + its `image` marker(s) — sections are the TOC unit and in-section
    segments carry no `entry:`. A file with NO embedded photos needs no such restructuring (it
    is already a clean flat directory of labeled `text` segments).

    ## `description` — the summary surface

    Write a faithful 1–3 sentence frontmatter `description` in a single physical line: name the
    source (the origin overlay says which — e.g. an iCloud/Apple contacts export, a Google
    Contacts Takeout slice), the contact count (the artifact block's `card_count`), and the
    vCard version. Stay faithful — describe what the file IS, not who the contacts are.

    ## `title`

    Author a frontmatter `title` from the origin: the export source + count, e.g.
    "iCloud contacts export — 150 contacts" or "Google Contacts (All Contacts) — 621 contacts".
    The artifact block carries `card_count` / `vcard_version` / `product_id` candidates.

    ## Embedded photos — describe (only when the file carried base64 photos)

    For each `<!--segment image-->` marker, the whole-asset description lives on the matching
    `<!--embed image/...-->` block (keyed by `address`), NOT on the segment (the marker body
    stays empty). Describe what the photo VISIBLY shows; do not infer the subject's identity
    from the card's name — that is a ledger claim citing evidence, not a record assertion.

    Note: a `text/vcard` resolver transform (materializing a card's embedded photo bytes from
    `corpus://<id>?el=<N>`) is NOT yet built — real exports so far carry photos as external
    URLs, not embedded base64, so no record needs it. When the first base64-photo export
    arrives, add `corpus.transforms.vcard` (the `el=`/`photo=` extractor, the HTML `extract_el`
    precedent) so the marker resolves and this describe pass can view the bytes. Until then the
    drafter still captures the photo faithfully (the embed's `transport` hash + the retained
    `.vcf` bytes), so nothing is lost.

    ## Privacy — this is (typically) a private personal corpus

    Names, phone numbers, emails, addresses, birthdays, and notes are the CONTENT. They are
    already in the faithful body; do NOT redact, mask, or placeholder. Derived sensitivity is a
    ledger/codex concern, never a partition here.

    ## Verification

    - `description` is a single physical line, populated.
    - Every card is one top-level `text` segment (or, once restructured for photos, one section)
      addressed `el=<N>` in card order; property lines are verbatim.
    - Every `image` marker is body-empty and its `el=` appears in some embed's `address`.
    - Drafter-emitted issues (skipped malformed cards, empty file) are preserved.
extended_fields:
  card_count:
    type: integer
    required: false
    source: file_metadata
    description: Number of `BEGIN:VCARD … END:VCARD` cards the drafter parsed (skipped malformed cards excluded). A fact about the bytes.
  vcard_version:
    type: string_or_list
    required: false
    source: file_metadata
    description: The `VERSION:` value(s) the cards declare (`3.0` for Google + Apple exports). A string when uniform across the file, a list when the file mixes versions.
  product_id:
    type: string
    required: false
    source: file_metadata
    description: The `PRODID:` value the cards declare (e.g. `-//Apple Inc.//iOS 26.2//EN`) — the exporting software, verbatim. Surfaced ONLY when uniform across the whole file; a long-lived address book whose contacts were last touched by many exporter versions (each card records its own PRODID) carries several, which are per-card provenance, not a file fact, and are omitted here.
