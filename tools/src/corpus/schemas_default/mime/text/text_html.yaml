description: |
  HyperText Markup Language — web pages, captured as SingleFile-style snapshots with CSS, fonts, and images inlined as `data:` URIs. Covers the single canonical MIME `text/html`. The drafter is purely mechanical: it removes only non-rendered infrastructure (`<script>`/`<style>`/`<noscript>`/`<template>`/`<link>` + HTML comments), computes each annotated element's `el=` child-index path in the raw artifact (ATH-CORPUS 3.6, spec §6.1.1), attests a dedup'd-by-content `<!--members-->` roster of images plus the `addressing:` stamp (parser identity + total element count, §7.1), and emits a single wrapping text segment containing the cleaned unstyled HTML (the page `<body>`) annotated with `data-el="<path>"` attributes. It does NOT strip page chrome — removing chrome (nav/header/footer/ads/cookie notices) is a capture-time, per-host concern (origin overlay `capture.interactions[].remove`), because a universal tool cannot reliably tell chrome from content and a wrong guess drops content silently. That wrapper's address is the list of the body's element children — each child's subtree, which together are the document's content. `<img>` tags in the cleaned HTML have their `src` stripped — `data-el` IS the address, and consumers construct `corpus://<hash>?el=<path>` from it when they need the bytes. The normalizer parses that HTML, decides section/segment structure, skips any leaked chrome, and emits markdown segments addressed by `el=` paths. Image positioning segments link to the roster's member rows by address membership. Structural recovery (heading hierarchy, table reconstruction, list rendering, equation extraction, link preservation) is the normalizer's job.
applies_to:
  content_types:
  - text/html
# whole-address admissibility: the address space is TOTAL under 3.6, so every region including the outermost
#   has an honest `el=` address. Absence here is unnecessary, not untrue.
whole_address: forbidden
# Resolver's initial working kind for the functional-URI pipeline (read schema-side).
working_kind: html
mode: body-draft
artifact_kind: self_contained
address_scheme:
- param: el
  type: string
  description: |-
    *(ATH-CORPUS 3.6, spec §6.1.1.)* A dotted child-index PATH walked from the artifact's `<body>`: `el=1` is the body's first element child, `el=1.3.2` that element's third element child's second. Components count ELEMENTS only (text nodes and comments are invisible), 1-based, one spelling per address (no leading zeros). The space is TOTAL — every element is addressable, `<div>`/`<span>` included; there is no whitelist, so no tooling change can ever re-point a stored address (§12.28 is the incident that rule comes from). A point path names the element AND its whole subtree, which gives the three claim forms: a container's own path for a subtree; a sibling range `el=<parent>.[<a>-<b>]` for a contiguous run of one parent's element children (inclusive, and their subtrees); an ordered address LIST for a region crossing subtree boundaries. There is deliberately NO flat `el=<N>-<M>` form — a span cutting across structure is not one structural thing, and that form is how over-claiming envelopes arose (records carrying it predate the §12.28 remap and read under the frozen legacy enumeration until remapped; the `addressing:` stamp on the artifact block says which grammar a record's addresses are in). Prose with no element of its own takes the path of the element that CONTAINS it — in a total space something always does. Every component must resolve: a path that walks past a parent's element-child count names nothing and is an `address-unresolvable` error, checked before any materializability question (the §12.24/§12.25 lesson). Two attested facts keep parses honest (§7.1): the artifact block's `addressing:` carries the pinned parser identity (`html.parser`) and the total element count, and a resolver whose own parse disagrees refuses loudly instead of walking the wrong tree. Resolver `corpus.transforms.html.extract_el` returns the decoded PIL image when the resolved element is `<img>`; non-img resolution via `el=` is not supported (the normalizer reads structural HTML from the record's body, not via the resolver).
- param: selector
  type: string
  description: |-
    [DEPRECATED, retained for legacy records drafted before v0.8.0.] CSS selector identifying a DOM element. New records use `el=` instead.
- param: xpath
  type: string
  description: |-
    XPath expression identifying the source DOM element. Alternative to `selector` for cases CSS can't express. Legacy.
members:
  media_types:
  - image/png
  - image/jpeg
  - image/svg+xml
  - image/webp
  - image/gif
  description: |-
    One row per unique-content image in the cleaned-HTML root, attested into the record's single `<!--members-->` block (spec §4.3.1.4; replaces the pre-3.4 per-asset `<!--embed <media-type>-->` block, §12.26), deduplicated by `transport` (the `blake3:<hex>` hash of the decoded image bytes). `media_type` rides the row itself as of 3.4 (moved off the retired block's opener line, since one `<!--members-->` block now carries mixed types) — read from the source `data:image/<type>;base64,...` URI prefix. When an `<img>` carries a `srcset`, the row (and the `el=` resolver) use the largest inlined variant, not the displayed thumbnail `src` — so members are full-resolution. The body never carries the bytes — only the roster; the actual image data lives in the artifact and is resolved on demand via `corpus://<hash>?el=<path>`. Pixel dimensions and verbatim `alt` text are NOT row fields — 3.4 retires both from storage; read them on demand from the `members` derivation op (`corpus://<hash>?members`, spec §6.2/§12.26) instead.
  fields:
    address:
      type: string-or-list
      required: true
      description: "Artifact address(es) where these bytes appear. Scalar (`address: el=1.3.8`) when bytes appear once; YAML list (`address: [el=1.3.8, el=1.5.2]`) when at multiple equivalent positions. Same polymorphic shape as Segment.address (SPECv2 §4.3)."
    media_type:
      type: string
      required: true
      description: "The member's full MIME type, e.g. `image/png`. Moved onto the row in 3.4 — formerly the retired per-asset block's opener line."
    transport:
      type: string
      required: true
      description: "`<algo>:<hex>` content hash of the decoded image bytes (`blake3:<64-hex>`). The member's content id and dedup key — identical bytes at multiple positions collapse to one row. Universal member field per spec §4.3.1.4 (handled by `records.append_member`)."
    bytes:
      type: integer
      required: true
      description: "The member's size in bytes, uncompressed. Present so size accounting over a corpus of containers costs one pass over records and no artifact reads (spec §4.3.1.4)."
# sha256/md5 now ride the corpus-wide default set (spec §7.9) — no declaration needed.
# `html-stampfree@1` is this format's own recipe: a capture-invariant identity hashing
# the artifact bytes after neutralizing only the corpus's own injected capture stamps
# (the `corpus-*` meta tags, the SingleFile save banner) — index-first, flush-only
# (spec §7.9's registry table; §4.2.1).
derived_hashes:
- html-stampfree@1
# Computed at draft time but NOT persisted — the write path into a record's `canonical:`
# field is disabled (spec §7.1 status note; content-canonical identity stays retired
# under v20, §7.9's "two tiers" — distinct from `html-stampfree@1` above, which IS a live
# `hash:`-flushable recipe: that one is capture-invariant identity, scoped to neutralizing
# only the corpus's own injected capture stamps, never a judgment about page content).
canonical_strategy:
  algo: blake3-canonical-html
  canonicalization:
  - parse with BeautifulSoup; drop <script>, <style>, <svg> subtrees
  - collapse whitespace runs to single spaces; trim node text
  - serialize remaining DOM with canonical attribute order
  - blake3 the serialization
  # Optional per-host content scoping (opt-in): an origin overlay may declare
  #   canonical:
  #     content_selector: [<css>, ...]
  # to hash ONLY the text inside the matching content region(s), excluding per-page
  # framing (the <title>, breadcrumbs, entry-specific headings). This collapses pages
  # that share one article reached by different links (e.g. ALLDATA DTC B0012/B0013 →
  # one "DTC B0012 or B0013" article) into a single record via content-dedup. The
  # selector is a UNION (one content region renders per route) and falls back to the
  # whole document when it matches nothing. Sourced from the overlay, not this schema,
  # because "what is the content region" is host-specific. See content_hash.compute.
normalization:
  method: refinement
  guidance: |
    This guidance applies to every normalize pass — both the initial pass against fresh drafter output and any later re-pass. The HTML drafter (`tools/src/corpus/draft/html.py`; older drafts at v0.7.x used `selector=` addressing and have no members roster at all) is mechanical: it removes only non-rendered infrastructure (scripts/styles/comments), runs the `_convert_field_pairs` rewrite, collapses KaTeX to LaTeX, computes each annotated element's `el=` child-index path in the raw artifact (spec §6.1.1), attests a dedup'd-by-content `<!--members-->` roster of images plus the `addressing:` stamp, and emits ONE `<!--segment text-->` whose body is the cleaned page `<body>` annotated with `data-el="<path>"`. Which elements get an annotation is the drafter's free emit heuristic — every element is ADDRESSABLE regardless (the space is total), so an element without an annotation still has a path you may cite. It does NOT remove page chrome — that is a capture-time, per-host concern (origin overlay `capture.interactions[].remove`), so expect chrome to leak into the body unless the capture step deleted it. Every structural decision is the normalizer's job.

    ## Drafter contract

    The drafted body contains:

    1. An `<!--artifact text/html-->` metadata block with the document fields (title, description, lang, og_site_name). The page's canonical (`<link rel=canonical>`) and post-redirect final URL are folded into the origin block's `uri:` list as aliases, and the capture time is the origin's `snapshot:` — none of these are artifact fields.
    2. One `<!--members-->` block — one row per unique-content image in the cleaned-HTML root, dedup'd by `transport`. Each row carries `address` (scalar or list, polymorphic per SPECv2 §4.3), `media_type`, `transport` (`blake3:<hex>` of the decoded bytes), `bytes` — the closed four-key shape (spec §4.3.1.4). It is wholly attested: re-derived from the artifact on every attestation, and not yours to edit. Pixel dimensions and `alt` text are NOT on the row — read them on demand from the `members` derivation op (`corpus://<hash>?members`) when you need them.
    3. One `<!--segment text-->` block whose body is the cleaned HTML, its address the list of the body's element children. Annotated elements (headings, prose blocks, tables, figures, images — the emit heuristic) carry `data-el="<path>"` where the path is the element's §6.1.1 child-index position in the **raw artifact**. `<img>` tags have NO `src` — the addressing scheme (`data-el`) is the address; construct `corpus://<hash>?el=<path>` from the `data-el` value when you need to resolve the bytes.

    Treat the cleaned HTML as your input. You'll be replacing the single `<!--segment text-->` block with N segments (text + image), optionally grouped into sections. The members block at the top of the body stays where it is — you just reference its rows implicitly by addresses your segments emit.

    When you need ground-truth drafter output — above all **which element each `el=` path actually is**, the one question worth answering before you write a single address — invoke the drafter ephemerally. Run this FROM the corpus root (`paths.find_corpus_root()` walks up from the cwd, so it fails anywhere above it):

        uv run --project <path-to>/tools --no-sync python -c "
        from bs4 import BeautifulSoup
        from corpus import paths, recordbuild
        from corpus.draft import html
        corpus_root = paths.find_corpus_root()
        record_id, _ = paths.resolve_record(corpus_root, '<hash-prefix>')
        artifact = corpus_root / 'artifacts' / record_id[:2] / f'{record_id}.html'
        build = recordbuild.begin({}, corpus_root)          # REQUIRED keyword-only arg
        result = html.draft(artifact, build=build, record_id=record_id)
        print('fields:', result.get('fields'))
        print('members:', [(m['address'], m['media_type']) for m in result.get('embeds') or []])
        print('issues:', result.get('issues'))
        for blk in build.blocks:                            # the CONTENT zone lands here
            print(f'block {blk.atom} @ {blk.address}')
            for el in BeautifulSoup(blk.body or '', 'html.parser').select('[data-el]'):
                text = ' '.join((el.get_text(' ', strip=True) or '').split())
                print(f'  el={el[\"data-el\"]:<4} <{el.name}> {text[:72]}')
        "

    That last loop is the `el=` → element map, and it is the difference between an address you verified and one you guessed. It answers the questions this overlay's "Addressing reality" note raises: which `el=` is the breadcrumb, which are images, where the Related-Information rail starts — and, since the space is total (§6.1.1), that prose with no annotated element of its own is addressed by the path of the element that CONTAINS it (a `<div>`'s path is as real as a `<p>`'s), never by borrowing a neighbouring image's address.

    Two API facts the older version of this snippet got wrong, both of which fail loudly: `html.draft()` takes a **keyword-only `build=`** (a `recordbuild.Build` from `recordbuild.begin`), and the drafted content zone lands on **`build.blocks`** — there is no `result['segments']`. `result` carries the metadata zone only (`fields` / `embeds` / `issues` / `canonical` / `origin_*`).

    ## There is no narrative summary to author

    A record's display `description` is derived, never authored (spec §4.2.3) — there is no
    frontmatter field this or any pass writes to, and no body header carries one either
    (retired 3.5). For HTML it resolves automatically from the role-marked artifact fields
    declared below (`meta[name=description]` / `og:description`), read verbatim, exactly as
    the classifications view is computed. A page that states neither is not a defect: it
    means the source said nothing about itself under that role, and an empty derived
    description is the honest result — never a signal to compose one by hand. Where a reader
    genuinely needs a summary the bytes don't state, that is a ledger claim over the record,
    authored against the concept, not this pass's to write.

    ## Section structure — H1 → H2 fallback → sectionless

    Parse the cleaned HTML in the input segment's body with BeautifulSoup. Identify section boundaries:

    - **If 1+ `<h1>` elements are present**, group top-level content into bare `<!--section-->` blocks bounded by each `<h1>`. The H1 text is TRANSCRIBED as the section's own opening structural mark (see "Section identity" below) — never a header field. Pre-H1 content (rare — usually CMS preamble) goes into a synthetic `Preamble` section (no structural mark, since there is no heading to transcribe).
    - **If no `<h1>` but the document has a clear hierarchy of `<h2>`-rooted sections** (typical for long technical documents — Isometric protocols, multi-section reports, structured methodologies, regulatory standards), group by `<h2>`. The H2 text is transcribed the same way. Pre-H2 content goes into a synthetic `Preamble` section.
    - **If the document is short** (a press release, news brief, marketing one-pager, blog post) **and lacks a clear sub-heading hierarchy**, leave it sectionless — a flat segment list is the right shape.

    Trust the source structure: don't fabricate sections. Don't merge two clearly-separate H2 sections into one because they're short. Don't split a single coherent section into pieces because it's long.

    The H1 vs H2 choice is a per-document call, not a per-overlay rule — make it based on which heading level is the *primary structural axis* of THIS document. Most Isometric protocols, Verra methodologies (when captured as HTML), and CDM registry pages are H2-rooted in practice (their H1 is the document title, but the body's section breaks land at H2). When in doubt, check whether the H1 appears once (it's the title — use H2 as the section axis) or recurs at top-level structural breaks (use H1).

    ## Section identity — a structural mark, never a header field

    Every section's own heading is TRANSCRIBED as its first child, a `<!--segment structural
    addr=el=<path> level=<N>-->` whose body is the heading text verbatim, links kept (spec
    §4.3.2.3 — "a structural byte-mark's text is its body"). There is no `entry:` field any
    more (retired 3.5, spec §4.3.2.1/§4.3.2.2) and no section header field to hold it — the
    mark is an ordinary segment, and it is what a derived TOC reads. Address the element that
    actually carries the heading text, never a neighbour.

    The heading level used as section boundaries (H1 if H1-rooted, H2 if H2-rooted) is what
    becomes this structural mark. Headings *deeper* than the section-bounding level (H3 / H4 /
    H5 / H6) CAN appear inline at the start of a following `text` segment's body when they
    introduce the prose that follows — `### Sub-heading\n\nfollowing prose`. They're
    sub-structure within a section, not section roots, and stay in the body rather than
    becoming their own structural marks.

    Aggregate consecutive prose blocks (`<p>`, `<ul>`, `<ol>`, `<blockquote>`) into a single text segment that preserves their reading flow. Tables, `<pre>` / `<code>` blocks, and figures break aggregation and emit their own segments (rendering rules below).

    ## Markdown rendering

    Render the HTML to markdown faithfully:

    - **Inline emphasis**: `<strong>` / `<b>` → `**bold**`, `<em>` / `<i>` → `*italic*`, `<code>` → `` `code` ``.
    - **Links**: `<a href="...">text</a>` → `[text](url)`. Keep cross-reference anchors (`href="#term-id"`) — those are the document's internal navigation and the reader uses them to follow definitions and prior sections.
    - **Lists**: `<ul>` → bulleted, `<ol>` → numbered; recursive nesting honored at deeper indents.
    - **Code blocks**: `<pre><code class="language-X">…</code></pre>` → fenced ```X … ``` block.
    - **Tables**: render as a markdown table when all rows have a single value per column. **Bail to raw HTML `<table>`** in the segment body when the source uses `rowspan` or `colspan` — markdown tables can't express merged cells, and methodology project-boundary tables routinely have "Baseline" / "Project" cells spanning multiple SSR rows.
    - **Equations**: the drafter has already collapsed KaTeX wrappers to `$inline$` / `$$display$$` LaTeX inline in the cleaned HTML. Preserve the LaTeX verbatim; no further conversion needed. Multi-character subscripts should already be brace-wrapped (`$EF_{CO_2,grid,y}$`); if a stray un-wrapped subscript slipped through, fix it.
    - **Figures**: emit one `<!--segment image-->` per `<img>` you decide to surface (see "Choosing which images to surface" below). Plus a text segment for any `<figcaption>` when present (the drafter doesn't have figure structure — you reconstruct from the cleaned HTML).

    ## Segment addresses

    Each emitted segment's `address` field is **read off the `data-el` attribute** the drafter annotated on the corresponding cleaned-HTML element. Single element → `address: el=<path>` — and the path names the element AND its whole subtree, so content that lives entirely inside one container needs only that container's path. Aggregated prose spanning a contiguous run of one parent's element children → the sibling range `address: el=<parent>.[<a>-<b>]`. An aggregation crossing subtree boundaries → an address LIST of the member paths (spec §4.3.2.2). There is NO flat `el=N-M` form (§6.1.1 — that retired grammar is how over-claiming envelopes arose); prose with no annotated element takes the path of the element that contains it. For `<!--section-->` wrappers, do not compute or write an envelope at all — a section's `address` retired in 3.7 (spec §4.3.2.1) and is derived from its children by every reader, never stored.

    **Do NOT use `selector=`** — that's the deprecated address scheme for pre-v0.8.0 records. New records use `el=` paths. The legacy `selector=` resolver stays registered for backward compatibility but no new addresses should use it.

    ## Image segments — link to members by address

    The drafter attests a `<!--members-->` roster row per unique-content image (spec §4.3.1.4). Each row carries `address` (the artifact-position(s) where the image appears), `media_type`, `transport`, `bytes` — nothing else; pixel dimensions and `alt` live in the `members` derivation (`corpus://<hash>?members`), not the row. Use the roster as your menu of available imagery, resolving `?members` when you need a row's dimensions or original `alt` to decide whether to surface it.

    For each image you decide to surface as an image segment:

    - `address: el=<path>` (the `data-el` value on the `<img>`, matching the row's address)
    - `body:` — stays empty (a positioning marker, permanent — spec §4.3.2.2, a marker never narrates; there is no `description:`/`desc=` field on it or the row to fill, see "Images" below).

    No reference field linking the segment to the row. The link is purely positional: the segment's `address` is placed by whichever row has that path in its `address` field (scalar match for unique-occurrence; list membership for repeated). For unique images, segment-address and row-address are equal (scalar match). For repeated images, the row has a list like `address: [el=1.3.8, el=1.5.2]`, and you emit one segment per address you want to surface (typically all of them; you may surface fewer if some occurrences are obviously decorative even when the bytes are substantive).

    ## Leaked chrome drops silently

    The drafter does NO chrome removal — chrome is removed at capture time (per-host `capture.interactions[].remove`), and whatever the capture step didn't delete leaks into the cleaned HTML. Expect MORE leaked chrome than a chrome-stripping drafter would leave: site nav/header/footer, related-post tiles in article bodies, newsletter capture forms inline between paragraphs, share/social widget rows, author bios appended below the content, "more from this section" carousels, recommended-articles grids, "subscribe" or "log in" prompts as `<p>` segments. When you see leaked chrome in the cleaned HTML, don't emit segments for it — silently skip those DOM elements. (When a host leaks chrome repeatedly, the durable fix is a `remove:` step in its origin overlay so the next capture excises it at source.) The artifact bytes remain the source of truth; no audit-trail mechanism in the record body is needed.

    Lean conservative: skip elements that are unambiguously chrome (cross-promotion of unrelated content, signup forms, share buttons). When an element is borderline (an author bio that names a domain expert; a "related coverage" list that references corpus-relevant articles), keep it. Faithfulness errs on the side of preservation.

    ## Bot-block pages

    When the drafter has emitted a record-scope `bot-block` issue (severity `blocking`) naming an Akamai / Cloudflare / Imperva / similar bot-block detection, the cleaned HTML is the block-page chrome — the page that came back instead of the article. Render the body lightly (a flat segment list is fine; it's evidence of the block, not substantive content). There is nothing to author beyond that: the block source lives on the drafter's own issue, the originating URL is already on the record's `origins[]` block, and the record's derived `description` stays whatever the role-marked artifact fields resolve to — often empty, and honestly so (§4.2.3). There is no frontmatter field to compose a summary into, and no prose to add to the issue either (§4.3.3.2 — "an issue carries no prose").

    Don't fabricate the underlying content. Don't remove the drafter's `bot-block` issue. Don't change the drafter's `severity` or `remediation` hint.

    ## Paywall pages

    When the cleaned HTML contains a clear lede + early paragraphs but cuts off before the article body — typical patterns: a partial paragraph followed by a "Subscribe to read more" call-to-action, a `<p>` containing literally `Continue reading with a subscription...`, paragraph count dropping abruptly at a soft-bound — the normalizer adds a record-scope `partial-content` issue naming the paywall, in structured fields — an issue carries no prose (spec §4.3.3.2):

        <!--issue partial-content/paywall
        severity: warning
        resolution: open
        detector: <normalizer-touch-id>
        publisher: <publisher>
        paragraphs_captured: N
        remediation: recapture_with_authenticated_session
        -->

    Render the captured lede / opening paragraphs faithfully — they're useful even partial. The normalizer judges paywall vs full article from segment density and trailing-segment signals; the drafter doesn't auto-detect paywalls (the signal is too varied).

    ## Choosing which images to surface

    The drafter attests one members-block row per unique-content image plus its address(es); resolve `?members` to see each row's dimensions and original `alt` when deciding. Most of them you'll want to surface as segments; some you should drop:

    - **Substantive imagery** — Figure / Diagram / Chart in alt text, larger dimensions (≥ 100×100 typically), appears once or in a small number of places, has a meaningful figcaption nearby. Surface as segments (one per `address` on the row; for a single-occurrence row that's one segment, for repeated bytes that's N segments).
    - **Decorative chrome** — small dimensions (< 32×32 per the `members` derivation's `width`/`height`), empty alt + no surrounding figure context, the same icon repeated many times across UI cards. Skip — emit no segment. The row stays in the roster either way: the roster is unabridged and wholly attested, so there is no pruning choice to make here — declining to place the asset IS the pruning decision (spec §4.3.1.4).

    Scan the `?members` inventory once to plan; then walk the cleaned HTML emitting text and image segments together so reading order is preserved.

    ## Images — resolve and read, transcribe what's recoverable

    Image segments are **body-empty positioning markers, permanent** (spec §4.3.2.2) — they
    mark where the image falls in reading order and carry no body, and there is no
    `description:`/`desc=` field on them or on the members-block row (wholly attested, carries
    no description field at all — spec §4.3.1.4/§12.26) to narrate what the image shows.
    Resolve and READ every image you surface before deciding what, if anything, is losslessly
    recoverable from it — never paste the alt text in as if it were a transcription; it's a
    hint for deciding whether to surface the row (see "Choosing which images to surface"
    above), nothing more.

    Resolve via the segment's own address (the same address that places it against the row):

        uv run --directory scripts corpus resolve 'corpus://<hash>?<address>'

    The command prints the cache PNG path to stdout. Read that file with the standard Read
    tool — you see the image. When a region of it is losslessly transcribable text (a data
    table, OCR-able prose, code, an equation, a caption printed inside the image), emit a
    SEPARATE text segment with the matching atom overlay on its opener (`text/data-table`,
    `text/ocr`, `text/code`, `text/equation`) at the chained sub-address. Where the
    transcription covers the image's whole own region, it REPLACES the marker (§4.3.2.2) —
    two segments on one region earn their place only by extracting different information.
    Layout, composition, and a photo's own visual content are not narrated anywhere: where
    nothing is losslessly recoverable, the marker alone is the complete, honest rendering, and
    `corpus resolve` is how a reader reaches it.

    For survival-relevant images (in-body figures, charts, diagrams), this resolve-and-read
    pass — deciding what's genuinely transcribable and transcribing it losslessly — is the
    main interpretive lift.

    When the resolver fails (corrupt data URI, unrecognized format, decode error) it raises a
    `ValueError`. Leave the marker body-empty and add a segment-scope `partial-content` issue
    (addressed at the image segment) naming the failure mode, then move on.

    ## Verification

    - Top-level body order: frontmatter → fields blocks → the `<!--members-->` block → sections/segments. No member rows interleaved between segments.
    - Top-level structure matches the rule above: H1-rooted sections, H2-rooted sections, or sectionless. No fabricated section breaks; no merged-across-natural-boundary sections.
    - Every top-level section opens with a `<!--segment structural-->` mark whose body is the heading text at the section-bounding level, verbatim, addressed at the element that carries it. No section or segment carries `entry:`, `title:`, or `description:` — all retired 3.5 (spec §4.3.2.1/§4.3.2.2); the parser rejects them.
    - **A `text` segment whose entire body is a single heading line with no following prose is miscategorized** — it belongs as a `structural` mark instead. Deeper headings (below the section-bounding level) stay inline at the start of `text` segment bodies rather than becoming their own marks.
    - Segment addresses are `el=` child-index paths (§6.1.1) referencing elements in the raw artifact (lifted from `data-el` annotations) — point paths, sibling ranges `el=<parent>.[<a>-<b>]`, or address lists; never the retired flat `el=N-M`. No `selector=` addresses on new emissions.
    - Every image segment's `address` appears in some row's `address` field (scalar match or list membership) — except resolver-materializable addresses (an artifact self-slice or a lineage-chained reference), which need no row at all (spec §4.3.1.4). An unplaced row (no segment surfaces it) is tolerated, never pruned — the roster is unabridged by design.
    - Every image segment is body-empty, permanent, and carries no `description:` field (retired 3.5 — neither the segment nor the row has one). Losslessly-recoverable content inside it is a separate transcribed sibling segment; a genuine faithfulness defect is a typed issue, never prose on the marker.
    - No pass writes a frontmatter `description`; it derives automatically from the role-marked artifact fields, and an honest empty result is not a defect.
    - Drafter-emitted issues (e.g. bot-block `partial-content`) are preserved. The normalizer may ADD issues (e.g. paywall) but doesn't remove or modify the drafter's.
extended_fields:
  title:
    type: string
    required: false
    role: title
    source: file_metadata
    description: Document <title> from the snapshot.
  description:
    type: string
    required: false
    role: description
    source: file_metadata
    description: Meta description or og:description, if declared.
  lang:
    type: string
    required: false
    source: file_metadata
    description: <html lang> attribute.
  og_site_name:
    type: string
    required: false
    source: file_metadata
    description: og:site_name, if declared.
# NOTE: the page's canonical URL (`<link rel=canonical>`) and post-redirect final URL
# (`<meta name=corpus-capture-url>`) are NOT artifact fields — the drafter folds them into
# the ORIGIN block's `uri:` list as aliases (spec §7.2; canonical/shortlink/final collapse
# to one origin). The capture timestamp is the origin block's `snapshot:` (set at ingest).
