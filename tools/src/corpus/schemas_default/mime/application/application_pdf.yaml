description: |
  Portable Document Format — Adobe's fixed-layout document format. Covers the single canonical MIME `application/pdf`. The drafter is **shape-aware**: per page it probes born-digital vs. scanned (the same probe the resolver exposes) and drafts accordingly — a born-digital page's embedded text layer lands pre-extracted as a `text` segment addressed to its measured non-chrome content band (`page=<N>&bbox=...`, falling back to a bare `page=<N>` when the geometry can't be trusted), a scanned or textless page keeps a body-empty `image` marker at bare `page=<N>`, and the PDF's top-level outline entries draft as structural byte-marks. Sectionless either way — section grouping is normalizer judgment. The normalizer verifies drafted text against the rendered pixels, handles hybrid pages and scanned OCR, measures exact boundaries with the resolver's introspection ops (`page=<N>&text` / `&words` / `&probe` / `&geometry`, `probe`, `outline`) and the `corpus bands` pixel-truth audit, and rasterizes pages / regions on demand via `page=<N>` and `page=<N>&bbox=<x>,<y>,<w>,<h>`.
applies_to:
  content_types:
  - application/pdf
# whole-address admissibility: pages. A one-page PDF is NOT an exception -- `page=1` is a true statement about
#   a real unit, so requiring it fabricates nothing.
whole_address: forbidden
# Resolver's initial working kind for the functional-URI pipeline (read schema-side).
working_kind: pdf
mode: body-draft
artifact_kind: self_contained
address_scheme:
- param: page
  type: integer
  description: |-
    Page number, 1-indexed. `page=0` is reserved as the sentinel address for a chrome segment carrying repeating page chrome (see `normalization.guidance`); content segments use `page=1` and above. The resolver only honours `page=1..page_count` — chrome segments at `page=0` carry the chrome's literal text in their body and aren't resolved to source bytes.
- param: bbox
  type: rect
  description: |-
    <x>,<y>,<w>,<h> — relative floats in [0.0, 1.0]. Origin top-left. x+w ≤ 1.0, y+h ≤ 1.0.
# Computed at draft time but NOT persisted — the write path into a record's `canonical:`
# field is disabled (spec §7.1 status note: it collapsed unrelated text-empty PDFs;
# content-canonical identity stays retired under v20, §7.9's "two tiers" — the `hash:`
# field admits only `html-stampfree@1`-style recipes that clear that bar, and this one
# hasn't).
canonical_strategy:
  algo: blake3-canonical-pdf
  canonicalization:
  - strip /Info CreationDate, ModDate, Producer, Creator
  - concatenate per-page extracted text in page order
  - blake3 the concatenation
normalization:
  guidance: |
    This guidance applies to every normalize pass — both the initial pass against fresh drafter output and any later re-pass. The PDF drafter is **shape-aware**: per page, it runs the same structural probe the resolver exposes (`page=<N>&probe`) and drafts from what it finds, rather than emitting one uniform marker per page.

    - **Born-digital, geometry trusted** → an `atom: text` segment whose body is the page's embedded text layer (pypdf), addressed to the page's measured non-chrome **content band**: `page=<N>&bbox=0,<top>,1,<height>`.
    - **Born-digital, geometry untrusted** (the page's assembled lines look fragmented, or the computed band would already cover ~the whole page) → the same `atom: text` segment, same raw pypdf body, but at a **bare** `page=<N>` address — imprecise rather than wrong.
    - **Born-digital, but effectively no text** (under ~5 non-whitespace characters extracted) → an `atom: image` body-empty marker at bare `page=<N>`, the same treatment as a scan.
    - **Scanned / no-text** (`image_coverage` ≥ 0.9, or a vector-only/DRM'd page with nothing extractable) → an `atom: image` body-empty marker at bare `page=<N>`.

    The PDF's top-level **outline** entries draft as `atom: structural` byte-marks (`address: page=<N>`, `level: 1`, body = the bookmark title verbatim), one immediately before its page's own content segment, in document order — the same treatment docx headings and EPUB nav already get. A fresh draft is still **sectionless** either way: grouping structural marks and their pages into `<!--section-->` blocks is normalizer judgment, never the drafter's (below).

    ## Page addresses are content bands, not whole pages — and bodies are not bands

    The address and the body of a `text` segment carry independent facts, and conflating them is the most common misreading of a fresh draft:

    - **The address** already excludes chrome geometrically. Rendering `page=<N>&bbox=0,<top>,1,<height>` crops out the running header, the document-id banner, and the `N of M` footer — you do not need to crop them away by hand. A bare `page=<N>` (no `&bbox`) on a `text` segment means the drafter could not trust that page's line geometry, not that the segment's *content* fills the whole page.
    - **The body does not.** The segment's stored body is pypdf's raw extraction of the **whole page**, unfiltered — the running header and page-number footer the address excludes are still sitting in the body text, verbatim. Stripping them from the body is still your job (see "Repeating page chrome" below); the drafter only ever adjusted the *address*.

    **Distinguish the two bare-`page=<N>` shapes by atom, not by address alone.** A bare address appears on both an `atom: text` segment (born-digital, geometry the drafter declined to trust) and an `atom: image` segment (scanned, textless, or blank) — they mean opposite things (unread text vs. no text to read), and the atom is the only field that tells them apart. The drafter declines the bbox — leaving the address bare — for measured reasons: the page's assembled lines look too fragmented to trust (the mathematical-italic tell — see "Measure the boundary" below), the computed content band would already cover essentially the whole page (at which point a bbox states a precision it doesn't have), or geometry simply couldn't be read at all. None of these is a defect to silently patch — a bare-address `text` segment is exactly as usable as a banded one, just less precisely addressed; if you tighten it during normalization, measure it (below) rather than guessing.

    ## Determine the shape — verify what the drafter already decided

    A fresh PDF record's per-page shape (above) already reflects one run of the same probe you can re-run at any time — for verification, for hybrid pages the drafter's single per-page call can't see into, and on any later re-pass:

        corpus resolve 'corpus://<hash>?probe' --print
        # whole-document probe (JSON): page_count, /Info, has_outline, shape_summary, and a
        # per-page table — width/height, rotation, text_char_count, image_coverage,
        # has_invisible_text, and an advisory shape_hint per page.

    Read the probe. `shape_hint` is advisory — you decide — but the signals are reliable:

    - **born-digital** (low `image_coverage`, real `text_char_count`) → the page already arrived with its text layer extracted into the segment body (see "Reading drafter signals" below) — the drafter made the same call this probe reports. Verify the drafted text against the rendered page (pypdf text is approximate — see "See the source" below); pull `?page=<N>&words` for the per-word boxes (`{text, bbox}` in `[0,1]` page fractions) when you need to map text to regions or detect column layout.
    - **scanned-ocr / scanned-no-text** (`image_coverage` ≥ 0.9) → the drafter left this page as a body-empty `image` marker. Any text layer it carried is a machine-OCR layer baked in *before* capture (`has_invisible_text` often flags it); treat the page as an **image-of-document** and produce the corpus's own OCR (next section). Do NOT pull `&text` and trust it as faithful source.
    - **no-text** (low coverage, zero text) → a vector-only or DRM'd page with nothing extractable; the drafter left it as a body-empty marker too. Leave the page marker body-empty and permanent, and add a record-scope `partial-content` issue naming the missing text layer.

    A document may be **mixed** (`shape_summary: mixed`) — born-digital body pages plus scanned inserts, or vice versa. The drafter already decided per page; this just confirms it.

    **Hybrid pages — a born-digital page can still hide raster content.** `shape_hint` keys on whole-page coverage (`image_coverage` ≥ 0.9 = scanned), so a born-digital page with a **sub-0.9 but nonzero** `image_coverage` (anything from ~0.05 up) is the tell that the page embeds a raster *region* — a figure, a chart, or a table rendered as an image — whose content is **NOT in the text layer**, and which the drafter's per-page shape call has no way to see. `page=<N>&text` (and the drafted segment body) returns nothing (or garbage) for that region. Do not trust the drafted text to have captured it: **render the page, find the raster region, and treat it as its own `page=<N>&bbox=...` segment** — a body-empty, permanent `image` segment for a figure/chart (no `description:` field to fill), and/or a sibling lossless `text/data-table` (or `text/ocr`) where the raster is a table or readable text. A born-digital page is "born-digital text plus zero or more raster inserts," not "all text."

    Don't re-extract content from the artifact yourself with `pdftotext`; the drafter's body is already pypdf's extraction, and the rendered page is the real source of truth. **Use the resolver to render pages and look at them** — see below.

    **Read every page as a raster at least once — even a born-digital one whose text already arrived pre-extracted. This is mandatory.** The probe and the drafted text are not enough to trust a page: pypdf's extraction silently mangles math and layout, and a born-digital page can hide a raster figure or table the text layer doesn't contain (see "Hybrid pages" above). So for **every page**, render it (`corpus resolve 'corpus://<hash>?page=<N>'`) and actually look at the pixels at least once — comparing what you see against the drafted text — *before* you decide how to re-segment it. A full-page overview render (~463 px) is enough for this compare-and-decide step: it shows you the layout, whether a region is a raster, and whether the text is intact. You then crop into any region you intend to transcribe losslessly (see "Crop-first is a REQUIREMENT"). **Never segment or transcribe a page you have not looked at.** (For a long PDF normalized in chunks, this happens within the pass that handles each page — every page in your chunk gets a raster read; you don't pre-read the whole document.)

    ## Scanned pages (image-of-document)

    When a page probes as a full-page raster (`shape_hint: scanned-*`, `image_coverage` ≥ 0.9), there is no faithful text layer to refine — the drafter has already left it as a body-empty `image` marker, exactly the shape a standalone image-of-document arrives in. Any text the file carried was a machine-OCR layer added *before* capture, which you ignore so the corpus produces (and provenances) its own OCR. Normalize the page **exactly as a standalone image-of-document** — the tactics are identical to the image mime guidance (`corpus overlay visual-type`, and the image schema's own guidance):

    - **See each page:** `corpus resolve 'corpus://<hash>?page=<N>'` to render it, or place regions by eye with `corpus preview <id> --page <N> --mark x,y,w,h`. Crop into a region (`page=<N>&bbox=...`) for fine print; `autocontrast` / `contrast=<f>` / `rotate=` / `resize=` compose just as they do for images (a scanned page is a raster — no `dpi=` detail to recover beyond the scan's own resolution).
    - **Transcribe text regions** as `<!--segment text/ocr-->` at `page=<N>&bbox=<x,y,w,h>` — one per logical text block, verbatim, recording `ocr_engine` (e.g. `vlm`) and `confidence` (see the `text/ocr` overlay). OCR segments **always carry a `&bbox=...` sub-region** — never the bare `page=<N>` address, which belongs to the page's image marker.
    - **Tables** → `<!--segment text/data-table-->` at `page=<N>&bbox=...`; **figures/photos/diagrams** → a body-empty, permanent `image` (sub-)segment at `page=<N>&bbox=...` (no `description:` field — the marker alone is the complete rendering).
    - **Page marker:** the drafter's whole-page `page=<N>` image marker is the positioning anchor — leave it in place and add the `page=<N>&bbox=...` sub-region segments around it (the "Figures, diagrams, charts" address-uniqueness + `page=` self-slice rules below apply unchanged; a `page=` image segment needs no embed).

    OCR of a scan is a normalizer (agent) pass, not an automatic draft step — the same status as image-of-text transcription generally. The remaining sections (outline sections, text refinement, chrome) apply to **born-digital** pages; a scanned page needs only its `text/ocr` / `text/data-table` / figure segments at `page=<N>&bbox=...`.

    ## See the source — resolve pages to images and READ them

    This is the single most important tactic for normalizing a born-digital PDF. pypdf's text extraction — what the drafter already put in a born-digital segment's body, and what `page=<N>&text` also returns — is approximate. It mangles equation glyphs (Unicode bold-mathematical-italic codepoints in place of typeset math), flattens column layout, drops spacing, hard-wraps prose at column width, packs footnote anchors as `0F`/`1F` superscript-marker garbage, and produces output that bears only weak resemblance to what the page actually contains. Treat the drafted body (and any `pdftotext` output) as a **low-quality starting point**, not source of truth — and `page=<N>&words` when you need each token's box. The PDF's rendered pixels are the closest available representation of what the document author put on the page; you are a multimodal model and you can see them directly.

    The corpus resolver rasterizes any page (or any bbox region of any page) on demand:

        uv run --directory scripts corpus resolve 'corpus://<hash>?page=<N>'
        # → /home/.../cache/<urihash>.png  (full page)

        uv run --directory scripts corpus resolve 'corpus://<hash>?page=<N>&bbox=<x>,<y>,<w>,<h>'
        # → cropped to the bbox region only

    The command writes a PNG to the cache and prints the absolute path on stdout. Read that file — you see the region. The resolver caches automatically; repeated calls with the same URI return instantly.

    ### Crop into the region, don't bump DPI

    The harness that delivers the resolved image to you aggressively downsamples large images to fit a token budget. A full-page render at the default 200 dpi is natively 1700×2200, but typically arrives as a 463×599 JPEG — a ~14× pixel reduction. Bumping `dpi=300` is unreliable: sometimes the harness passes the larger PNG through unchanged, but it can also downsample back to 463×599 anyway. **The reliable lever is cropping into the region of interest.**

    A `bbox` crop is in [0.0, 1.0] units of the page, so a 0.1 × 0.15 crop of an equation row is natively 170×330 pixels at 200 dpi — small enough that the harness has nothing to downsample. You see it at full source fidelity.

    As a deliberate alternative to leaving the harness to downsample unpredictably, request `page=<N>&fit=llm` for a full-page read: it downscales to the vision-model budget explicitly (`fit=llm` bounds the long edge to ≤1568 px and the total to ≤1,150,000 px, §12.5.5) rather than an opaque post-hoc resize, and a full A4/Letter page fit to that budget still reads legibly for body text, table rules, and section headings at well under a third of a native 200dpi render's pixel count. Footnotes and subscripted variables still want a tight crop at that size or below.

    **Crop-first is a REQUIREMENT, not advice, for lossless work.** Before you transcribe a table, an equation, or any fine detail (footnotes, sub/superscripts, formula glyphs, a numeric grid) into a **lossless `text/*` segment** (`text/data-table`, `text/equation`, `text/ocr`, `text/code`), you MUST resolve a `page=<N>&bbox=...` crop of that exact region and read *it*. A transcription or description produced from a full-page (~463 px) render is **insufficient fidelity** and is not acceptable for a lossless body — the downsampling silently corrupts digits, superscripts, and glyphs, and lint cannot catch a wrong number. (Overview reads of full pages are fine for *recognizing* structure; they are not fine for *transcribing* it.) After writing your `bbox=` segments, verify the frames: `corpus preview <id> --page <N> --from-segments` redraws the committed boxes so you can confirm each crop frames what you transcribed.

    Use the crop-first tactic whenever you need to read fine detail:

    - **Equations** — crop the equation row (and the line of text introducing it). Read the LaTeX glyphs directly rather than reconstructing from pypdf's mangled Unicode-math output. A typical equation crop is ~0.8 wide and ~0.1 tall.
    - **Small tables** — crop the table region. Markdown reconstruction is much more reliable from a high-fidelity crop than from a downsampled full-page render.
    - **Footnote text** — footnotes are typically 8–9pt; the full-page render flattens them to unreadable. Crop the footer band (`bbox=0,0.85,1,0.15` or similar) and read the actual citation.
    - **Multi-column page layout** — crop each column separately to read each at full fidelity.

    When you don't know where the interesting region is yet, do two reads: `bbox=0,0,1,0.5` (top half) and `bbox=0,0.5,1,0.5` (bottom half). Two half-page reads at native ~850×1100 beat one full-page read downsampled to 463×599.

    For an overview read (cover page layout, "is there a figure here?") the full-page render is fine — you only need to recognize structure, not read fine text. Reach for crops the moment you need to read specific content.

    Run `corpus resolve --help` for the authoritative list of available transforms and their exact parameter shapes. Never guess crop or resize parameter forms — running --help is cheap and authoritative; bbox validation rejects out-of-bounds values.

    ## Measure the boundary — `corpus bands` and `?geometry`

    Any boundary the drafter didn't already draw for you — a section split mid-page, a footnote band, tightening a bare-address page's bbox, a figure's extent — deserves to be **measured**, not read off a rendered page by eye. Two instruments exist for exactly this, and they read different things:

        corpus bands <hash> --rows <N>                                # rendered pixels: every ink row's top/bottom, and the gaps between them
        corpus resolve 'corpus://<hash>?page=<N>&geometry' --print     # PDF text layer: per-line y/h/x0/x1/text, chrome flags, heading candidates, the non-chrome body band

    Both report in the same relative, top-left-origin space `bbox=` uses, and a row's `top`/`y` is the value a crop must clear to avoid slicing it.

    - **`corpus bands`** renders the page and measures ink directly. It cannot be defeated by a text-layer defect, because it never reads the text layer — which is also its limit: it locates rows, it can't say what they contain. Read the page render to learn which content belongs to which row, then take the *numbers* from `bands`.
    - **`?geometry`** reads the same text layer `&text`/`&words` do, so it additionally tells you what a row *says* — heading candidates, chrome flags, x-extents for a column split. Two costs come with that: it mangles the same glyphs `&text` mangles (a curly apostrophe decoding as a stray character on some older PDFs — take **words** from the raster, not from geometry), and it cannot band a page set in mathematical-italic Unicode (the U+1D400 block some equation-heavy documents use for variable names), where one physical line reports at several different `y` values at once. Fragmentary single- or two-character `text` values in the line list are the tell — the same signal that makes the drafter itself decline a bbox for a page (above). That failure is silent and lands precisely on equation pages, the pages hardest to address by eye, so a page carrying equations is a `bands`-only page.

    **Set a band the way the drafter does.** The drafter pads its own measured band by ~0.0025 (roughly 2pt on an A4 page) above and below the content extent — glyph boxes are exact, but a crop that hugs them looks clipped, and a page's text layer can under-report a descender. Match that convention for any boundary you set by hand: `y = firstRow.top - 0.0025`, `h = lastRow.bottom + 0.0025 - y`.

    **Audit what you wrote.** `corpus bands <hash>` (no `--rows`) audits every `page=<N>&bbox=...` band already in the record against the rendered pixels, reporting bands that cut a text row, bands that swallow chrome, drifted bands, and content rows no band covers. **Zero bands cutting a text row is the bar** — an edge inside a line means neither side of the cut renders a readable sentence, and it's not optional the way an uncovered gap can be (a gap is often a sanctioned drop, e.g. a trailing metadata block a schema says to skip; a cut never is).

    ### Page-walk strategy

    - **Render every page in your working range as a full-page raster at least once and look at it** — the compare-and-decide step from "Read every page as a raster" above. Not optional, and not limited to "suspicious" pages: a born-digital page that probes clean can still carry a hidden raster or layout the text layer flattens, and you only find out by looking.
    - Cover page first (full render is fine — you're recognizing structure).
    - For each page that carries an equation, a table, a figure, a hidden raster, or any region the drafted text shows with pypdf damage: **crop into** the specific region(s) and read at full fidelity — required before any lossless transcription (see "Crop-first is a REQUIREMENT").
    - A short PDF (≤10 pages) is a cheap full walk. A long PDF is read **per chunk** — the every-page raster read happens within the pass that normalizes each page (see "Large PDFs — chunked normalization"); you don't pre-read all 200 pages at once, but you never segment a page you haven't seen.

    ## Fresh per-page signals — `probe`

    A page's structural signals never go stale relative to the source, because they're recomputed straight from the PDF bytes each time — reachable any time, independent of anything already written into the record's body: `corpus resolve 'corpus://<hash>?probe' --print` (whole-document) or `?page=<N>&probe` (one page). Use it to re-read a page's extracted-text length, image coverage, rotation, and shape hint at any point in a normalize pass.

    ## Forward reference

    The bulk of media-agnostic body-refinement tactics — paragraph reflow, heading promotion, tables (markdown vs HTML fallback), equation LaTeX rendering, footnote renumbering, image description, definitions sections, re-segmentation — live on the `document` overlay. If its cues match (most PDFs in this corpus carry structured-document content), apply it and read its guidance via `corpus overlay document`. Its guidance is media-type-agnostic; this PDF schema's job is to add the pixel-level "go read the page" tactic, the PDF-specific re-segmentation rules below, and the chrome-address convention. **Note:** a corpus may stub the base `document` overlay (its tactics living only on a subclass like `document/product-manual`), so `corpus overlay document` can come back with no `normalization.guidance`. That's fine — this PDF schema is self-sufficient for the structural work: tables, figures, multi-region addressing, footnote ownership, and re-segmentation are all covered below. Don't block on the forward reference.

    For image segments inside the PDF, pick the structural kind on the opener (`<!--segment image/chart-->`, `image/figure`, `image/photo`, …; run `corpus atoms --atom image`). When the record as a whole is dominantly visual, the record-scope `visual-type` overlay (`corpus overlay visual-type`) adds idiom-specific description tactics.

    ## Reading drafter signals

    A fresh PDF record's segments already carry the shape decision (above) — read the **atom** and the **address** together to know what you're looking at:

    - **`atom: text` at `page=<N>&bbox=...`** — born-digital, geometry trusted. The body is pypdf's raw extraction of the whole page (not just the banded region — see "Page addresses are content bands" above), verbatim, unrefined: column-width hard wraps, footnote anchors packed as `0F`/`1F` superscript-marker garbage, mangled math glyphs, repeating chrome lines still present. Verify against the render (above), reflow into prose, strip chrome, and split out atom-prefixed sub-segments (equations/tables/figures); the drafted segment is your starting material, not a finished one.
    - **`atom: text` at bare `page=<N>`** — born-digital, but the drafter declined to trust this page's geometry (fragmented line assembly, or a band that would already cover the whole page). Same raw-pypdf body, same refinement work; when you tighten the address, measure it (`corpus bands`/`?geometry`, above) rather than guessing a bbox that then needs auditing anyway.
    - **`atom: image` at bare `page=<N>`** — scanned, textless, or a born-digital page whose extracted text came back blank. Treat exactly as "Scanned pages" above: keep the marker as the positioning anchor, add `page=<N>&bbox=...` sub-segments (`text/ocr`, `text/data-table`, figures) around it. Nothing in the probe distinguishes "scanned" from "blank born-digital" at this point — re-run `page=<N>&probe` if it matters which.
    - **`atom: structural` at `page=<N>`, `level: 1`** — a drafted outline entry, body = the bookmark title verbatim, sitting immediately before that page's content segment. This is the seed of a section (below) — group it and the segments that follow, up to the next top-level mark or the document's end, under a `<!--section-->` block. The drafter keeps only the **first** entry when two outline entries resolve to the same page — if the source's second heading is genuinely worth preserving, add it yourself as a bbox-scoped structural mark (see "The outline is a starting point" below).
    - **figures** (on any page) → bare image segments (see "Figures, diagrams, charts"): resolve `page=N&bbox=...`, Read it, tighten the bbox, and transcribe any losslessly-recoverable content as a sibling segment (body and marker both stay empty of any description — the field doesn't exist).
    - **no extractable text** (probe `shape_hint: no-text` — DRM'd / vector-only) → the page arrives as the same body-empty `atom: image` marker as a scan; add a record-scope `partial-content` issue naming the missing text layer.

    Record-level — read frontmatter and the `<!--artifact application/pdf-->` block:

    - `page_count` — total pages.
    - `title`, `author`, `creation_date`, `producer` — from the PDF /Info dict; role-marked candidates the derived title/description resolve from automatically (spec §4.2.3), never facts this pass composes prose from. Rarely reliable as a cover-page title (publishers often leave /Info defaults like `Adobe Acrobat`, `Microsoft Word`, or the author's local username) — an unreliable or empty derived title is a fact about the source, not a defect to fix by hand.

    ## Sections — group from the document's structure (SPEC §4.3)

    A fresh draft is always **sectionless** — no `<!--section-->` wrapper exists yet, even when the drafter has already seeded top-level structural marks from the outline (above). **Sectioning is the normalizer's job**: wrapping each structural mark (or, for a heading the source doesn't bookmark, one you find yourself) and the segments that belong to it into a `<!--section-->` block. A `<!--section-->` is a positional span with no body and no stored header field of its own — `entry:` (and `address`) retired from the section header in 3.5/3.7 (spec §4.3.2.1); the derived TOC now reads structural byte-marks instead (§4.3.2.3).

    **How a section's address works — read this before you assign one.** You do **not** compute or write a section's page range — it is **derived**, never stored: the min-max page envelope of its child segments, computed by every reader (`bbox` plays no part — the envelope is over pages). You assign segments to a section and the envelope follows automatically; there is nothing to write on the opener beyond the bare `<!--section-->` (or the form id, where one is asserted). Two consequences, both easy to get wrong:

    - **Adjacent sections may legitimately share a boundary page.** Section A ending on page 9 and section B starting on page 9 is fine — there is no section-overlap rule. (What you must NOT do: give two *segments* the same `page=N&bbox` region — see below.)
    - **A section's own heading is TRANSCRIBED, not labeled.** For an outline-seeded section this transcription is already done — the drafted `<!--segment structural addr=page=<N> level=1-->` opening it carries the bookmark title verbatim (spec §4.3.2.3); for a section you introduce yourself (no outline entry), open it the same way. This is what a derived TOC reads. There is no `entry:` field anywhere any more, on a section or a segment; a figure's identifying label, where the source prints one, is its own transcribed `text` segment, never a header field (see "Figures, diagrams, charts").

    **The outline is a starting point, not an authority.** The drafter has already read it and seeded a structural mark for every resolvable top-level entry (above); re-read it yourself to audit that seeding or to handle a case it didn't (below):

        corpus resolve 'corpus://<hash>?outline' --print
        # JSON tree of {title, page (1-indexed), children}; [] when the PDF has no bookmarks.

    A clean, complete outline needs only wrapping: group each drafted structural mark and its remaining page-range segments into a `<!--section-->`; a synthetic `Preamble` section (no structural mark, since there is no heading to transcribe) wraps unbookmarked front matter (cover, Contents). But real outlines are frequently broken, and the drafter's mechanical seeding inherits every one of these problems rather than solving them — section from the document's **genuine printed structure**, not the outline mechanically:

    - **Missing top-level headings** — the outline (and so the seeded structural marks) omits real printed sections (an un-bookmarked "Consumer Information" leaflet). Add a structural mark and section for each from the printed headings yourself; don't let a naive "last entry runs to page_count" bury them.
    - **Degenerate single bookmark** — the entire document nested under one bookmark (common in drug-label SPLs). Ignore the seeded mark and section from the printed top-level headings instead.
    - **Duplicate / non-monotonic entries** — many entries anchored to pp1–2, out of order, repeated (Highlights + a Contents listing + the body all bookmarked). The drafter keeps only the **first** entry resolving to a given page and silently drops the rest (above) — the noise you'd otherwise dedupe by hand is already gone from the drafted marks; still section from the real printed structure, not whatever the surviving marks happen to say.
    - **Two top-level entries on the same page** — the drafter has already resolved this collision by keeping only the first entry's mark, so you won't find two structural marks fighting for one bare `page=N` address. If the *second* entry's heading text is still worth preserving verbatim, add it yourself as a second structural mark at a distinct `page=N&bbox=…` crop of just that heading — never at the same bare address the first mark already claims (segment identity is `(opener-id, address)`, spec §4.3.2.2). This is the standard move for a dense single-page run of headings.

    **PDF without an outline** (the op returns `[]`). Section from the printed structure when it's clearly present (see "Normalizer-introduced sections" below); otherwise stay sectionless — a legitimate shape for short or structure-light PDFs.

    ### What a section is NOT

    A section is a structural grouping primitive — no body, no stored header field of its own (its envelope derives from its children; there is no `entry:` field, spec §4.3.2.1). The section opener is followed directly by its first child segment opener; prose between section closer and first segment opener is a parse error. **Don't confuse the section block primitive with document-content sections (chapters, headings, clauses).** A derived TOC reads the structural marks inside sections, not a section header field; the document-content sense of "section" describes prose inside segments (the next subsection's "Re-segment to structural units" discussion uses "section" in the document-content sense — that's about paragraph and prose grain, not block boundaries).

    Inside a section, child segments still re-segment along structural-unit grain (one prose-flow segment per chapter-section, plus separate segments for embedded equations/tables/images). The section block contains the segments; segments contain the prose.

    ### Sub-outline entries

    Only the **top-level** (level-0) outline entries arrive as drafted structural marks, even though the `outline` op itself returns the full nested tree (each node's `children`) — nested entries are never promoted, by the drafter or by you. PDF outlines often carry sub-entries (chapters with sub-chapters, appendices nested under a parent); those nested entries stay off the section list. Sub-outline content lives inside its parent section's child segments, with prose-internal headings (`##`, `###`) representing the sub-structure. A PDF whose top-level outline groups all appendices under "Definitions" becomes one section spanning the appendix range; that's faithful to the source author's outline grouping.

    ### Normalizer-introduced sections (sectionless drafts)

    A drafter-shape sectionless PDF (no outline → flat top-level segments) MAY be re-organized into sections during normalization when document structure is genuinely present in the prose. Trigger when:

    - The document has clear top-level structure (numbered chapters, named appendices) reliably detectable from the prose;
    - The normalizer's re-segmentation pass would otherwise produce a sprawling top-level segment list that's hard to navigate.

    When introducing sections after-the-fact, choose section boundaries that match the document's own structural hierarchy, not arbitrary page ranges. Each new section's envelope derives automatically from the segments assigned to it — open it with a structural mark transcribing the document's own top-level heading text verbatim (spec §4.3.2.3), never an `entry:` field.

    Don't introduce sections just to be tidy on a short PDF (≤20 pages). Sectionless is a legitimate shape for short or structure-light PDFs.

    ### Legacy flat-segment records — in-place upgrade

    Records normalized before the section + segment grammar landed (commit `8b777bd`) carry a flat top-level segment list with no `<!--section-->` blocks. They parse cleanly via legacy handling, but their structural TOC is impoverished — every segment shows at top level rather than grouped under outline entries.

    Upgrade in place without re-extracting, through the standard decompose → edit → compile flow. `entry:` on any pre-upgrade segment is migration residue (spec §4.3.2.2, 3.5) — a name source to read during the upgrade below, never a field to preserve:

    1. Read the PDF's outline: `corpus resolve 'corpus://<hash>?outline' --print`. For each top-level entry you get `{title, page}` (1-indexed). End page is the page before the next top-level entry; the last entry runs to `page_count`.
    2. `corpus decompose <hash>`. In the manifest, group the existing `seg` lines under bare `section addr=pages=<start>-<end>` lines per the outline ranges, and open each with a `seg structural addr=page=<N> level=1` whose body carries the outline title verbatim. A `seg` whose first page falls before the first outline entry (or a `page=0` chrome segment) goes under a synthetic bare `section` with no structural mark (there is no heading to transcribe).
    3. Keep each segment's body file and address exactly as they are — this upgrade is structural-only (it only adds section grouping), no content rewrite. Strip any stale `entry:` from every segment you move under a section — it retired in 3.5 and has no home on a segment inside or outside a section any more.
    4. `corpus compile <dir> --model <your-model-id>`. The record stays at `status: normalized`; the upgrade is itself a normalize pass, so it earns a touch.

    A sectionless PDF that produced a flat segment list MAY remain sectionless if the source has no outline — no upgrade required. Only wrap when the source carries an outline.

    ## Re-segment to structural units

    The drafter emits one content segment per page because page is PDF's natural transport grain — banding trims the *address* to the page's non-chrome content, but the grain is still one page, one segment. Page boundaries do not respect document structure — a paragraph wraps from column 1 to column 2; a paragraph continues across pages; a numbered list of steps interleaves with an equation. The normalizer re-segments at structural-unit grain.

    **A segment is logically contiguous content of one classification.** Multi-column text on one page is one segment. Cross-page text continuation is one segment. An embedded artifact of a different classification (an image, an equation, a table, a figure) forces a segment boundary — the surrounding prose splits and the artifact gets its own segment.

    Use the address-as-list form (SPEC §4.3) to express the multiple source regions a single segment occupies. Each entry is in reading order:

        <!--segment text
        address:
        - page=2&bbox=0.10,0.10,0.40,0.85    # left column of page 2
        - page=2&bbox=0.55,0.10,0.40,0.85    # right column of page 2
        - page=3&bbox=0.10,0.10,0.40,0.50    # continues into top of page 3 left column
        -->

        <reflowed prose for the full multi-region segment>

    Reflow the prose across region boundaries — drop the mid-paragraph line break that the source-format wrap introduced; rejoin words split across the boundary. (Segments carry no `fingerprint:`/`perceptual:` field in v1.0 — it's suppressed; don't add one.)

    ### Atom-prefixed classifications at segment scope

    Embedded artifacts that interrupt prose get their own segment with an atom-prefixed classification:

    - `text/equation` — a display equation (and its `\tag{N}` numbering, if any). The body is the LaTeX form of the equation. If the equation has a following WHERE / variable-definition table, that's a SEPARATE `text/data-table` segment immediately after.
    - `text/data-table` — a structured rows-and-columns block. The body is a markdown table (simple cases) or an HTML `<table>` (merged cells, multi-row headers, complex cells). See `corpus overlay document` for rendering tactics. **Body contract:** the body is the faithful table — header rows plus data rows. The table's printed **caption and footnote legend** (the `*`/`†` notes that decode its cells) are part of reading the table, so you may keep them *with* it (a leading caption line and/or a trailing legend in the same body) — OR split them into sibling `text` / `text/footnote` segments when the legend is long or shared across tables. Both lint clean; keep them in the body when they're short and specific to this table. A leading `##`/`###` heading is fine when a sub-section opens directly on the table with no prose to host it. (Run `corpus atoms --atom text` for the full list of lossless text overlays — `text/code`, `text/footnote`, `text/ocr`, etc.)

    The surrounding prose stays in bare `<!--segment text-->` segments with no overlay — that's the default "prose flow" segment. (Unique repeating chrome is also a bare `text` segment — see "Repeating page chrome" below.)

    Image-atom segments (`atom: image`) appear at their source position in document order — first-class peers of text segments, not embedded inside a text segment's body. They have their own address (typically `page=N&bbox=...`). They are **body-empty positioning markers, permanent** — there is no `description:` header field any more (retired 3.5, spec §4.3.2.2: "a segment cannot narrate its own region"); the marker says where the bytes are and nothing about what they show (see "Figures, diagrams, charts" below).

    ## Figures, diagrams, charts — bare image segments, never embeds

    A figure on a PDF page is a **crop of the rendered page**, not a separately stored asset. The resolver rasterizes `page=N&bbox=...` from the PDF's own bytes on demand — the artifact *is* the source, exactly as a video framegrab is a slice of the video (see `schema/mime/video/video.yaml`). So a figure is a **bare `<!--segment image-->`** with:

    - `address: page=N&bbox=<x>,<y>,<w>,<h>` — the page region.
    - **No `description:`.** There is no field on the marker to carry a reading of what the crop shows — composition, on-screen text, chart structure are not narrated. Where the figure's identifying label (a caption printed on the page — "Figure 2 — WAG operation schematic") is genuinely source text, transcribe it losslessly as its own `text` segment at its own address, never as a header field on the marker. Body stays **empty** (image atoms are body-empty per SPEC §4.3.2.3).
    - **No `<!--members-->` row, and no `transport:` hash.** The `embed-missing-target` lint rule carves out `page=` addresses on PDF records precisely because no separate asset exists. Never compute a blake3 of a rendered crop and present it as a member transport — that fabricates an asset the corpus doesn't store.

    A losslessly-transcribable region inside a figure (a data table, an equation, OCR-able caption text) is a **separate** `text/<overlay>` segment (`text/data-table`, `text/equation`, `text/ocr`) at a chained `page=N&bbox=...` address — sibling to the image marker, carrying the lossless body. Where the transcription covers the figure's whole own region, it REPLACES the marker (§4.3.2.2) — two segments on one region earn their place only by extracting different information. Where nothing in the figure is losslessly recoverable (a photo, a diagram whose layout is the content), the marker alone is the complete, honest rendering; a genuine faithfulness defect (illegible, cut off) is a typed `issue` at that address, never prose on the marker.

    **The members roster is attestation's job, not yours.** Genuine member rows exist only for assets attestation extracted as distinct byte-streams (e.g. an inline `<img>` decoded from an HTML page — `schema/mime/text/text_html.yaml`). A PDF yields none, so on a PDF record you never create one — and never edit the roster on any record. If you believe the source contains a genuinely separable embedded asset attestation failed to extract, **persist an `<!--issue missing-media-->`** describing it rather than fabricating a row.

    ### Multi-page tables

    A table whose body extends across a page boundary is one `text/data-table` segment with multiple bbox entries in its address list:

        <!--segment text/data-table
        address:
        - page=4&bbox=0.10,0.50,0.80,0.45    # header row + first body rows on page 4
        - page=5&bbox=0.10,0.10,0.80,0.40    # remaining body rows on page 5
        -->

        | header | header |
        | --- | --- |
        | row | row |
        ...

    If the source physically repeats the header row at the top of each subsequent page (a common multi-page-table convention), include the header row once at the top of the merged table — do not duplicate it.

    ### Segments on one page that are NOT contiguous

    The same logic applies inside a single page: if one section ends mid-page and the next section begins below it, those are two segments. Use single-region bbox addresses (`page=4&bbox=0,0,1,0.6` for the upper, `page=4&bbox=0,0.6,1,0.4` for the lower). When ONE section is the upper half AND continues onto the next page's upper half, that section is one segment with two bbox entries.

    ### Non-contiguous regions on the same page (footnotes belonging to a prior section)

    A common PDF layout: section N's prose occupies the upper part of page P; section N+1 begins partway down page P; section N's footnote definitions sit in a footer band at the bottom of page P, BELOW where section N+1 already started. The footnote belongs to section N (it was referenced from section N's prose, per `document.yaml`) but the footer band is physically interrupted by section N+1's bbox.

    Solution: section N's address is a list of bboxes that includes BOTH its upper-page region AND the footnote band, JUMPING OVER section N+1's region. Section N+1's bbox is sandwiched between them. Concretely:

        # Section N — includes the page-P footnote zone
        <!--segment text
        address:
        - page=<P-1>&bbox=...           # earlier pages of section N
        - page=<P>&bbox=0.05,0.10,0.90,0.50    # section N continuation, upper part of page P
        - page=<P>&bbox=0.05,0.85,0.90,0.10    # footnote band at bottom of page P (section N's footnote)
        -->

        # Section N+1 — sandwiched between section N's upper and footnote regions
        <!--segment text
        address: page=<P>&bbox=0.05,0.62,0.90,0.18
        -->

    Two different things are being decided here, and only one of them is a judgment call. *Which* region belongs to which segment is the logical partition — every visible region of source content belongs to exactly one segment — and that is a content question you answer by reading the page. *Where the edge lands* is a measurement: an edge may sit anywhere in the whitespace between two rows, so a little slack is fine (match the drafter's own ~0.0025 padding, above); an edge **inside** a row is a defect — the crop then renders half a line, and the address no longer bounds the content it names. Take the partition from the prose and the numbers from `corpus bands` (above).

    ### Address uniqueness across segments

    Per SPEC §4.3, no two segments in a record may claim the same source region. A multi-region segment listing `page=4&bbox=A` and `page=5&bbox=B` blocks any other segment from claiming `page=4&bbox=A` or `page=5&bbox=B`. When you re-segment, the union of every segment's address list must be a partition of the source content the segments collectively cover — no overlaps. Where an edge sits within the whitespace between two rows is slack (above); the partition over logical content is exact — a region of source content belongs to exactly one segment, even when that requires multi-bbox jump-over addresses on a single page. `corpus bands` audits exactly this: run it after you re-segment to confirm no band cuts a row and no content row is claimed by nothing.

    ## Large PDFs — chunked normalization

    For PDFs with more than ~50 pages, normalize in chunks rather than attempting the whole document in one pass. Even with the crop-first tactic, holding hundreds of page renders plus the re-segmented body in one agent context isn't realistic. Aim for **40–60 pages of source content per normalize pass (target ~50)**, adjusted to section boundaries.

    Empirical sizing (measured against the 1M-context Opus model `claude-opus-4-7[1m]`, across a ten-chunk normalize of a 205-page methodology):

    - Floor cost is ~150k tokens regardless of chunk size — the boot tax of reading the record, scanning schemas, planning, and saving. A 2-page chunk still used 152k. Don't pick a chunk below ~5 pages; it doesn't pay back.
    - A 36-page dense chunk (lots of new heading structure + definitions) peaked at 280k tokens.
    - A 31-page chunk consisting of one giant table merged into a single segment ran at 173k — page count is a poor predictor; structural-work density matters more.
    - Mean prompt size across the ten chunks was ~200k. The 1M window has comfortable headroom; ~50 pages is the sweet spot.

    ### Reading + editing the record — decompose/compile + the TOC tools

    Editing happens through the **decompose → edit small files → compile** workflow (see the normalizer agent doc) — never Read+Edit the monolithic record markdown. `corpus decompose <hash>` explodes the record into a working dir of small per-segment body/desc files plus a `manifest.corpus`; you edit those and `corpus compile <dir> --model <id>` re-assembles + lints + writes atomically. This sidesteps the "whole-file Read fails on a 250KB+ record" problem entirely — you only ever load the small files you touch.

    For recon before decomposing, two read-only tools:

        uv run --directory scripts corpus toc <hash>          # segment table of contents: ordinal, atom, structural-mark body
        uv run --directory scripts corpus segment <hash> 7    # one segment's full detail (by ordinal or address)

    `corpus toc` is your one-shot shape recon — the record's full structure in a few hundred lines, derived from the structural marks (there is no `entry:` field to read any more). A page still in drafter shape shows as a single segment whose body is raw, unrefined pypdf text (`atom: text`, at either a `page=<N>&bbox=...` content band or a bare `page=<N>`) or a body-empty `atom: image` marker at bare `page=<N>` — see "Detect prior-pass state" below for the exact discriminators. The first such ordinal in document order is where your chunk starts, and any section-opening structural marks let you pick a clean end boundary at a section break.

    ### Detect prior-pass state

    On startup, walk the body's segments and find the first page still in fresh drafter shape. The drafter now emits three different-looking segments depending on what it decided about the page (above), so the discriminator is no longer one shape — check the **atom** first:

    - **`atom: text`** — drafter-shaped when its body is still raw, unrefined pypdf output: column-width hard wraps, no heading promotion, footnote anchors packed as `0F`/`1F`/`2F`, mangled equation glyphs in Unicode mathematical-bold-italic codepoints, repeating page chrome still sitting in the text. The **address alone doesn't decide this** — a bbox-addressed segment can still be un-normalized, since the address only ever excluded chrome geometrically, never from the body (see "Page addresses are content bands" above). A **normalized** page looks structurally different: prose reflowed into single physical lines per paragraph, headings promoted to markdown `#`/`##`, chrome stripped from the body, equations rendered as LaTeX, tables as markdown/HTML, and — usually — a list-form or bbox-refined address in place of a bare one, plus sibling atom-prefixed segments (`text/equation`, `text/data-table`, `text/code`, `image/…`) split out where the page carried any.
    - **`atom: image` at a bare `page=<N>`** — drafter-shaped (scanned, textless, or blank) when it has **no sibling segments addressing that page** — a scanned page you haven't yet added `text/ocr`/`text/data-table`/figure sub-segments around, or a figure you haven't cropped. Normalized: the marker is **kept and surrounded** by `page=<N>&bbox=...` sub-segments per "Scanned pages" above.
    - **`atom: structural`** marks (drafted outline entries) aren't a normalize target themselves — they're the seed a `<!--section-->` wraps (above); a structural mark with no enclosing `<!--section-->` block is a sign sectioning hasn't happened yet, but isn't itself "drafter-shaped content" to refine.

    The first page whose content segment is still drafter-shaped by either test above, in document order, is where this pass starts. If every page is still drafter-shaped, start at page 1.

    ### Choose the chunk range

    Target 40–60 pages of contiguous source content starting at the first un-normalized page (~50 is the sweet spot). Adjust the upper bound to a clean section boundary:

    - If a new top-level section starts on page X within your target range and extends past your target ceiling, **stop the chunk at page X−1** so the next pass handles that section as a whole. Don't cut a section mid-normalize.
    - If the target ceiling falls inside a section that started earlier, **extend the chunk** to the section's end page even if that pushes the chunk to 70 pages. A section is the structural-unit grain (`document.yaml`); finish it before stopping.
    - If extending would balloon the chunk way past 60 (e.g. an 80-page section), accept the larger chunk — sections trump page count. Better to do one 80-page section in one pass than to leave it half-normalized across two passes.

    Use the table of contents (typically pages 2–5) to plan: scan the section list, pick a chunk that ends at a clean section boundary near 50 pages in.

    ### Normalize the chunk

    Apply every structural-unit tactic to the segments in your chunk range: chrome strip (the body's own text, not just the address — above), heading promotion, section-grain prose-flow segments, atom-prefixed segments for equations / tables / code / figures, multi-region addresses where content spans columns or pages, footnote ownership rules, equation LaTeX reconstruction from page renders, wrapping any drafted structural marks into `<!--section-->` blocks. The segments outside your chunk range are left exactly as the drafter emitted them — don't touch them.

    Re-segment freely within your range. Each drafter-shaped `atom: text` segment in the range — its raw pypdf body sitting at a content-band or bare `page=<N>` address, no atom-overlay siblings split out yet — gets replaced by the structural-unit segments you produce; a drafter-shaped `atom: image` marker gets kept and surrounded (above), not replaced. The segments outside the range stay drafter-shaped. The body ends up in a mixed shape: structural-unit segments for the normalized range, drafter-shaped (band- or page-grain) segments for the rest.

    ### Cross-chunk references

    A footnote, equation, table, or section heading referenced from inside your chunk may have its definition outside your chunk (in pages your pass isn't normalizing). When this happens:

    - **Footnote definition outside the chunk** — render the reference (`[^N]`) but leave the definition where it physically sits (in the drafter-shape segment at its page). The next pass that normalizes that page will pick the definition up and place it correctly.
    - **Equation or table cross-reference** — if you reference "Equation 47" from your chunk and Equation 47 is outside, just use the plain reference text. The forward reference resolves when both segments are normalized.
    - **Section cross-reference** — same. "See Section 6.5" stays as prose; no link rewriting needed for now.

    Forward references that need rewriting (intra-document blake3 wikilinks, etc.) are handled by a later link-rewrite pass (§8.1), not by the normalizer.

    ### Save, stop, append touch

    When the chunk is done, compile it with `corpus compile <dir> --model <your-model-id>` exactly as for a single-pass normalize — that records your combined compile+model touch (no separate `corpus touch`). The touch dedup appends `_N` suffixes when the same compile-version+model is the last touch — that's fine across chunks. Keep the record at `status: draft` between chunks.

    **Do NOT advance to `status: normalized` until the final chunk** — the one that normalizes the last page of the document. On that final pass, before flipping status, walk the segment list and verify every segment has been structurally re-segmented (or genuinely belonged at page-grain because it had no embedded artifacts and was just a clean paragraph on one page). If any segment is still drafter-shape, the document is incomplete; stay at `draft` and surface the gap.

    ### Resume

    The next normalize pass repeats: scan, find first un-normalized page, pick a 25–40 page chunk ending at a section boundary, normalize, save, stop. Each pass is independent; the agent on each pass doesn't need any state beyond what's visible in the current record body.

    ## Repeating page chrome

    Per the `document` overlay, mechanical chrome (page-N footers, repeated document-title headers, URL footers) is **silent-stripped** from content-bearing segments — no separate chrome segment is needed. **This is body-text work, not address work**: the drafter's content-band address already excludes chrome pixels when rendered, but the segment's stored body is unfiltered pypdf output and still carries the chrome lines verbatim (see "Page addresses are content bands" above) — stripping them from the body during normalization is unchanged from before. The cover content already carries the document title; the strip loses nothing.

    When chrome carries information beyond mechanical pagination (a "DRAFT" or "CONFIDENTIAL" watermark, a running header that names a different version than the cover, an embargo notice), hoist to one **bare `<!--segment text-->`** at the top of the body carrying the chrome's literal text verbatim — a single representation of the repeating chrome, not one per page. There is no `text/chrome` overlay in v1.0; chrome that's worth keeping is just faithful text. The segment carries:

    - `address: page=0` — the chrome-segment sentinel reserved in this schema's `address_scheme`. Unique within the record; the resolver doesn't resolve `page=0` to page bytes (the body is the chrome's own text, not an extracted page region).
    - body: the chrome's literal text (the watermark / running-header / embargo string), verbatim — no field summarizes it, the body is the whole statement (retired 3.5, spec §4.3.2.2).
    - If it's worth identifying in the TOC, PRECEDE it with a `<!--segment structural addr=page=0 level=1-->` whose own body is a short label ("Watermark", "Running header") — a distinct segment, different opener-id, so it shares the `page=0` address legitimately (spec §4.3.2.2). There is no `entry:` field to hold that label on the text segment itself.

    Do not invent synthetic content-region bboxes (e.g. `page=1&bbox=0,0,1,0.15`) to "describe the chrome region" — bboxes denote actual extracted source regions, not heuristic chrome zones.

    ## Faithfulness

    The body is a faithful normalized rendering of the source. The resolver lets you SEE the source; use it. Do not invent column names, do not paraphrase equations, do not editorialize alt text. Re-segmentation is structural — segment boundaries may move — but the content within remains what the source page actually shows.
extended_fields:
  page_count:
    type: number
    required: true
    source: file_metadata
    description: Total number of pages in the PDF.
  title:
    type: string
    required: false
    role: title
    source: file_metadata
    description: Title from the PDF /Info dictionary, if present.
  author:
    type: string
    required: false
    source: file_metadata
    description: Author from the PDF /Info dictionary, if present.
  creation_date:
    type: string
    semantic_type: timestamp
    required: false
    source: file_metadata
    description: Creation date from the PDF /Info dictionary (ISO-8601).
  modification_date:
    type: string
    semantic_type: timestamp
    required: false
    source: file_metadata
    description: Last-modified date from the PDF /Info dictionary (ISO-8601).
  producer:
    type: string
    required: false
    source: file_metadata
    description: Producer/creator tool from the PDF /Info dictionary.
  language:
    type: string
    required: false
    source: derived
    description: Detected primary language (ISO 639-1 code).
