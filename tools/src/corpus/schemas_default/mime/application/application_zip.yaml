description: |
  Raw ZIP archive — a generic container, not a structured-document container like
  OOXML xlsx/docx/pptx or EPUB. Per ATH-CORPUS 2.1 (the containment amendment) it
  drafts as a self-contained embed **manifest**: every member becomes a
  content-addressed embed (blake3 `transport` + `path=<relpath>` address), the
  content zone stays empty, and any member may later be **promoted** to a first-class
  record whose bytes never leave the archive (spec §1.2, §8.1, §12.4). Raw zips no
  longer explode at ingest — a member record exists only where someone deliberately
  promoted it.

  Structured-zip media types (xlsx, docx, pptx, epub, jar — fixed internal layouts)
  are detected one level deeper in `corpus/mime.py:_refine_zip` by their telltale
  parts (e.g. `xl/workbook.xml` for xlsx) and route to their own self-contained
  drafters; they never reach this entry. A corpus that wants a *particular*
  archive-shaped bundle recognized as its own type declares its shape via
  `applies_to.zip_member_patterns` (§7.1) and points it at this same `zip-manifest`
  strategy.
applies_to:
  content_types:
  - application/zip
# whole-address admissibility: members are the content (disposition: manifest); each is addressed at `path=`.
whole_address: forbidden
# Resolver's initial working kind for the functional-URI pipeline: `path=<relpath>`
# materializes a member's bytes (`transforms/zip.py`).
working_kind: zip
draft:
  strategy: zip-manifest
# (3.2) `comment` (the zip archive comment, when present) is role-marked title: real
# corpus evidence (both `corpus assemble` producer-export bundles — discord-export /
# google-takeout / facebook-export — and `corpus session capture`'s claude-code-session
# zips) shows it's consistently a deterministic identity string the corpus's own tooling
# stamps (`<producer>-export · <name> · <account> · exported <timestamp>`), not producer-
# arbitrary junk — an honest title-shaped fact for the bundle. It sits at the artifact
# layer (weakest in the §4.2.3 precedence), so a producer-export origin overlay's more
# specific title mark (task 3) still wins when one exists. The `zip-manifest` drafter also
# writes a `title` field (the root-stripped wrapper-dir name) when `draft.manifest.root_strip`
# is enabled, but no corpus enables that for plain `application/zip` today (only the
# unraid-diagnostics subtype does, on its own mime schema) — left undeclared here for lack
# of real evidence; see `application_unraid_diagnostics.yaml` for that mark instead.
extended_fields:
  comment:
    type: string
    required: false
    role: title
    source: file_metadata
    description: The zip archive's comment field, when present. The corpus's own assembly/session tooling stamps a deterministic identity string here (job/producer + name + account + export timestamp); a third-party zip's comment may be empty or unrelated, in which case the layer simply falls through.
