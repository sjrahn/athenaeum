description: |
  A promoted media-stream leaf's raw H.264 payload (spec §2, v32, the payload-identity
  principle): the avcC config record's parameter-set NALs (SPS/PPS) followed by every
  sample's NAL units, in decode order, exactly as the container's `stsz`/`stsc`/`stco`
  tables lay them out — NO reframing (no Annex-B start codes synthesized). A
  deterministic, engine-free extraction produced by `corpus.streams.extract_stream`,
  never a standalone capture. Minimal schema: this type exists so a promoted track
  record flows through ingest/lint/resolve like any other artifact; the track itself
  carries no further mime-declared structure (it is a formless leaf — frame work rides
  the video atom's derivation ops, §1.2).

  A bare payload carries no container timing of its own — no timescale, no duration — so
  `frame=`/`time_range=`/`scenes=` on the leaf's own hash resolve through **route
  unification** (§6.2, v32): the resolver treats `corpus://<leaf>?<ops>` and
  `corpus://<container>?stream_id=<n>&<ops>` as the same resolution (they name the same
  bytes by the §2 identity equation), running timeline ops against the container's real
  tables. Measured over 8 rostered containers (the pre-route-unification pilot, when a
  bare Annex-B stream was resolved directly): no leaf reported a duration at all (8/8,
  the field absent rather than N/A), every leaf reported the same meaningless placeholder
  rate (`avg_frame_rate=25/1`) whatever its source, and a real decode agreed with the
  container in only 2 of 8 cases — both h264 with clean VUI-declared CFR. Three diverge
  by a constant real_fps/25 factor and two by a non-constant drift no factor inverts. And
  seeking failed even where detection agreed: on a leaf whose cut list matched exactly,
  `ffmpeg -ss 30` returned success and a zero-byte image — input seeking and a filter
  graph's fabricated timestamps are not the same mechanism. This is the empirical case
  for route unification, not merely its rationale.
applies_to:
  content_types:
  - video/h264
# (3.3, §7.1) A formless leaf (above) is exactly a disposition: work format with no
# faithful markdown shape — the terminal-contract default follows. An origin overlay's
# own `form:` (§7.2), or a per-record asserted section (e.g. this specific track
# recognized as a real `slide-deck`, §12.20), overrides either way: a stamped
# per-record judgment outranks the class default (§7.8, governing-contract precedence).
#
# (3.11) The default stays terminal, and it is a statement about the AUTHORED layer only. The
# track's DERIVED body (`corpus://<id>?body`) now carries one body-empty `image` marker per
# scene span under the record's stamped `cutting:` strategy (§7.2.1) — the mechanical proposal,
# the PDF's page markers on a timeline. Adopting those markers into the stored body is the
# authoring act, and it is the same act that supplies a rendering contract (the §12.20 pilot
# track's asserted `slide-deck` section is exactly this) — so no record is ever a stored
# rendering under a terminal contract. A leaf nobody has authored is therefore not an
# obligation, which is the right default for a track nobody has looked at yet.
form:
  id: passthrough
