description: |
  A promoted media-container video track's pinned Annex-B elementary stream (spec §12.20.1):
  the avcC config record's parameter-set NALs (SPS/PPS) followed by every sample's NAL units,
  reframed to start-code framing, in decode order — a deterministic, engine-free extraction
  produced by `corpus.streams.extract_stream`, never a standalone capture. Minimal schema: this
  type exists so a promoted track record flows through ingest/lint/resolve like any other
  artifact; the track itself carries no further mime-declared structure (it is a formless leaf
  — frame work rides the video atom's derivation ops, §1.2). A bare elementary stream carries
  no container timing of its own — no timescale, no duration — so `frame=`/`time_range=`/
  `scenes=` on the track's own hash resolve through **timeline inheritance** (§6.2, 3.11): the
  resolver reads the leaf's containment lineage and runs the op against the CONTAINER with
  `stream_id=<n>` composed in. That is also where the shared-timeline composition lives (§1.2),
  which is why the leaf's stored `time_range=` addresses are in the container's seconds and not
  in a timebase imputed to the stream. The gap is large, not marginal: the §12.20 pilot deck's
  track probes as 60 fps / 616.53s inside its container and as **25 fps with no duration** once
  extracted, because the encoder wrote no VUI timing and the decoder falls back to a default —
  so a leaf-relative address would land at 2.4x its intended position. Before 3.11 these ops
  ran against that imputed timebase and produced an empty output rather than a wrong frame only
  by luck of which guard fired first.
applies_to:
  content_types:
  - video/h264
# (3.3, §7.1) A formless leaf (above) is exactly a disposition: work format with no
# faithful markdown shape — the terminal-contract default follows. An origin overlay's
# own `form:` (§7.2) — or a per-record asserted whole-record section (e.g. this specific
# track recognized as a real `slide-deck`, §12.20) — overrides either way (§7.8).
#
# (3.11) The default stays terminal, and it is a statement about the AUTHORED layer only. The
# track's DERIVED body (`corpus://<id>?body`) now carries one body-empty `image` marker per
# scene span under the record's stamped `cutting:` strategy (§7.2.1) — the mechanical proposal,
# the PDF's page markers on a timeline. Adopting those markers into the stored body is the
# authoring act, and it is the same act that supplies a rendering contract (the §12.20 pilot
# track's asserted `slide-deck` section is exactly this) — so no record is ever a stored
# rendering under a terminal contract. A leaf nobody has authored is therefore not an
# obligation, which is the right default for a track nobody has looked at yet.
form:
  id: passthrough
