applies_to:
  content_types:
  - image/avif
# whole-address admissibility: AVIF may hold an image sequence as well as a still.
whole_address: single_unit_only
whole_address_count: frame_count
# The frame axis (#124, 2026-08-09): a 1-based ordinal `frame=<N>` selects one frame
# of the sequence; an inclusive span `frame=<A>-<B>` is the whole-sequence ASSERTION
# (spec section 4.3.2.2) — a rendering that claims to hold across every frame in the
# span (a burned-in caption that never changes), checkable frame by frame. Chains
# frame-then-region: `frame=3&bbox=...` names a region OF frame 3 (spec section 6.2).
# The subtype declares its OWN scheme (this list replaces the axis default's bbox-only
# scheme rather than merging with it), so bbox is restated here.
address_scheme:
- param: frame
  type: index-span
  description: |-
    1-based frame ordinal `N`, or inclusive span `A-B` (the whole-sequence assertion).
    Bounds-checked against the attested `frame_count`. Must lead its chain.
- param: bbox
  type: rect
  description: |-
    <x>,<y>,<w>,<h> - relative floats in [0.0, 1.0]. Origin top-left. After a `frame=`,
    addresses a region of that frame.
