# Universal artifact-block fields — applied to every <!--artifact <mime-type>--> block
# regardless of media-type. Per-type extensions live at schema/mime/<type>.yaml;
# per-subtype at schema/mime/<type>/<subtype>.yaml. Field declarations layer:
# mime.yaml -> <type>.yaml -> <type>/<subtype>.yaml.
#
# See SPEC.md §7.1 (namespace yaml convention) and §7.2.1 (mime namespace).

description: |
  Universal fields every artifact carries on its <!--artifact-->  block, regardless
  of media-type. Per-type yamls in this directory extend with format-specific fields.

  There is NO universal `title` field. When a format exposes one it rides as a bare
  `title` field on the artifact block declared by the per-type schema — the block opener's
  MIME already names the provenance, so the candidate isn't prefixed. Non-primary-source
  titles (yt-dlp) land on the origin block as `ytdlp_title` (whose `ytdlp_` prefix survives
  because the origin opener names the source record, not the extraction tool). The
  normalizer picks among those candidates to author the frontmatter `title` (spec §4.2.1).

extended_fields: {}
