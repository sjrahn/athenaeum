description: |
  MP3 (MPEG-1/2 Audio Layer III). A bare, single-elementary-stream audio file — not a
  container, not a manifest of members. The bytes ARE the terminal rendering (spec §7.8,
  3.3): a `form: {id: passthrough}` mime default follows below.
applies_to:
  content_types:
  - audio/mpeg
# (3.3, §7.1) The format's terminal-contract default. An origin overlay's own `form:`
# (§7.2) — or a per-record asserted whole-record section — overrides this either way.
form:
  id: passthrough
