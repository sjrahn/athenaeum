description: |
  A promoted media-container audio track's pinned ADTS elementary stream (spec §12.20.1): a
  synthesized 7-byte ADTS header (no CRC) per sample, from the esds `AudioSpecificConfig`,
  immediately followed by the raw AAC sample bytes, in decode order — a deterministic,
  engine-free extraction produced by `corpus.streams.extract_stream`, never a standalone
  capture. Minimal schema: this type exists so a promoted track record flows through
  ingest/lint/resolve like any other artifact; the track itself carries no further
  mime-declared structure (it is a formless leaf — the transcript rides the audio atom's
  derivation ops, `?transcribe`, §1.2).
applies_to:
  content_types:
  - audio/aac
# (3.3, §7.1) A formless leaf (above) is exactly a disposition: work format with no
# faithful markdown shape — the terminal-contract default follows. An origin overlay's
# own `form:` (§7.2) — or a per-record asserted whole-record section — overrides either way.
form:
  id: passthrough
