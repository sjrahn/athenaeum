description: |
  A promoted media-stream leaf's raw AAC payload (spec §2, v32, the payload-identity
  principle): the codec's own `raw_data_block` samples concatenated verbatim, in decode
  order, exactly as the container's `stsz`/`stsc`/`stco` tables lay them out — NO ADTS
  header synthesized, no framing of any kind. A deterministic, engine-free extraction
  produced by `corpus.streams.extract_stream`, never a standalone capture. Deliberately
  not a playable file on its own: sampling rate, channel configuration and timing live in
  the container's own tables (the `esds`/`AudioSpecificConfig`), which is why every op
  needing playable input (`?transcribe`) resolves through the container instead
  (route unification, §6.2) rather than against this leaf's bytes directly.

  `corpus://<this-leaf> ≡ corpus://<container>?stream_id=<n>` is an identity equation
  (§2) — both name the same payload bytes. Minimal schema: this type exists so a promoted
  track record flows through ingest/lint/resolve like any other artifact; the track
  itself carries no further mime-declared structure (it is a formless leaf — the
  transcript rides the audio atom's derivation ops, `?transcribe`, §1.2).
applies_to:
  content_types:
  - audio/aac
# (3.3, §7.1) A formless leaf (above) is exactly a disposition: work format with no
# faithful markdown shape — the terminal-contract default follows. An origin overlay's
# own `form:` (§7.2), or a per-record asserted section, overrides either way: a stamped
# per-record judgment outranks the class default (§7.8, governing-contract precedence).
form:
  id: passthrough
