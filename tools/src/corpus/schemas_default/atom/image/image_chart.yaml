class_id: image/chart
kind: atomic
description: |
  A chart or data visualization (bar chart, line chart, scatter plot,
  pie chart, etc.). The placing segment's own `description:` carries the
  reading of what the chart conveys (axes, key trends, callouts).

  When the chart's underlying data can be losslessly transcribed, pair
  this overlay with a sibling `text/data-table` segment at the same
  address carrying the markdown-table form.
applies_to:
  atom: image
enables_lossless: false
