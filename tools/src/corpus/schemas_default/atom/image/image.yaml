class_id: image
kind: atomic
description: |
  Common guidance for image-atom classifications. An image-atom segment
  declares its specific classification on the opener line —
  `<!--segment image/chart-->`, `<!--segment image/photo-->`, etc. The
  bare `<!--segment image-->` form is permitted for image segments whose
  specific kind isn't (yet) declared.

  Image-atom segments are positioning markers in document flow: their
  body must be empty. The image's description lives in exactly ONE place:
  the **segment's own `description:` header field** — the block that places
  the asset in the reading order. That holds whether or not a separate
  asset exists:

  - **Artifact-self-slice (no member row)** — the address is a crop of the
    record's own artifact bytes (a `page=N&bbox=...` region of a PDF, a
    `bbox=` of a single-image record, a `frame=`/`time=` of a video). There
    is no separate asset; the resolver renders the slice on demand.
  - **Separate embedded asset (a member row)** — the segment points at a
    genuinely distinct asset (e.g. an inline `<img>` decoded from an HTML
    page, addressed `el=N`), which the record rosters as a row of its
    `<!--members-->` block. The row supplies the asset's byte identity and
    nothing else: it is wholly attested and carries no `description` field
    at all (spec §4.3.1.4, §12.26). The description still goes on the
    placing segment.

  Normalizers never touch the members block — it is re-derived from the
  artifact on every attestation. Write the segment `description:`; never
  fabricate a member row or a transport hash from a rendered crop.

  Image-atom overlays never set `enables_lossless: true` — they are
  purely descriptive of an image kind. A lossless transcription of image
  content lives on a separate text-atom segment (e.g. `<!--segment
  text/data-table-->`, `<!--segment text/ocr-->`) at the same address.
applies_to:
  atom: image
enables_lossless: false
