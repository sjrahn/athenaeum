class_id: text/metadata
kind: atomic
description: |
  A platform-generated event line within a conversation — a join/leave notice, a call
  record, a pin, a channel-name change — that the exporter emits as a message-shaped entry
  but which is NOT authored *content* (spec §12.18 step 4, the DCE event case). The segment
  body is the event's verbatim text (lossless). Kept as its own atom so a composition view
  (or a harvest rule) can distinguish authored messages from system events without parsing
  prose. An event may still be **attributed** to an actor — a DCE `Call`'s caller, a pin's
  pinner — whom the exporter records as the entry's author; that actor is a fact and rides the
  `participant:` codebook index, exactly like a `text/message`. A truly author-less event
  (a bare join notice) carries no `participant:`.
applies_to:
  atom: text
enables_lossless: true
extended_fields:
  participant:
    type: integer
    codebook: participants
    required: false
    description: |
      Codebook index — the 0-based position of the event's attributed actor (the caller who
      placed a call, the member who pinned a message) in the enclosing form section's
      `participants:` list (§7.3). Present only when the exporter attributes the event to an
      actor; a truly author-less event (a system join/leave notice) omits it. Unlike a
      `text/message`, the index attributes an EVENT to an actor, not authorship of content.
  timestamp:
    type: string
    semantic_type: timestamp
    required: false
    description: The event's time, in the source-stated zone, where the export states one.
  event:
    type: string
    required: false
    description: |
      The event kind, verbatim from the export — the producer's own discriminator value that
      marks this entry as an event (DCE's `Call` / `RecipientAdd` / `ChannelPinnedMessage`, a
      Google Chat system-message type). The mechanical `conversation` shaper stamps it here when
      a mapping's `kind` value (naming where the discriminator lives in the source) is in its
      `event_kinds` list (spec §12.18 step 4). Omitted when the source states none.
normalization:
  guidance: |
    Transcribe the event line verbatim — it is a platform event, not authored content, so do
    not paraphrase or summarize it. Where the exporter attributes the event to an actor (a
    call's caller, a message's pinner), carry that actor's codebook index on `participant:`;
    a bare, author-less notice carries none. Where the exporter states an event kind, carry it
    verbatim on `event:`; otherwise leave it off.
