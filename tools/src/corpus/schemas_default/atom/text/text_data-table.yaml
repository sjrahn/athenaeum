class_id: text/data-table
kind: atomic
description: |
  The segment body is a lossless table transcription of a relation-bearing
  region in the addressed content. The address chain must reach a region
  capable of carrying that relation — a `bbox=` over an image, a region within
  a PDF/HTML page, an image record's whole transport, etc.

  *(3.8)* **Two body shapes, and the source picks which.** A markdown pipe
  table where the source's table is simple; an **HTML `<table>`** wherever it
  is not. Markdown is the smaller, more readable form and stays the default for
  the simple case — but it cannot express a merged cell, a two-level header, a
  block inside a cell, or a caption, and a transcription that silently flattens
  one of those is not lossless. Reach for HTML the moment the source needs it;
  the reader renders both, so the choice costs nothing and buys fidelity.

  Use this overlay when the source content is a **relation set whose tuples
  the source itself fully determines** and whose cells can be transcribed
  verbatim. A region drawn as a grid is the common case, but grid geometry is
  incidental — see the graph-shaped note under `normalization`. If a "table"
  is actually a layout artifact (key-value pairs styled with table HTML, code
  blocks dressed up as tables), use a more appropriate overlay (`text/code`
  for code, plain text for k-v prose).
applies_to:
  atom: text
enables_lossless: true
extended_fields:
  row_count:
    type: integer
    required: false
    description: |
      Number of data rows (excluding header).
  column_count:
    type: integer
    required: false
    description: |
      Number of columns.
  has_header_row:
    type: boolean
    required: false
    description: |
      Whether the first row is a header (column titles).
normalization:
  guidance: |
    Transcribe column headers and cell values verbatim. Do not paraphrase,
    summarize, or omit cells.

    **Pick the shape from the source, before you start transcribing.** Getting
    this wrong is the expensive mistake — a markdown table that had to flatten a
    merged header has lost a fact, and nothing downstream can tell.

    Use **markdown** when every one of these holds: one header row, no merged
    cells, no caption, and every cell is a short run of inline text. That is the
    common case and it stays the default.

    Use an **HTML `<table>`** as soon as any of these appears:

    - a **merged cell** — `rowspan=` / `colspan=`. A two-level header
      (`Specification` spanning `Metric` + `Imperial`) is the usual trigger and
      is extremely common in service data.
    - a **caption** — the table's own title (below).
    - a **block inside a cell** — a bulleted list, several paragraphs, a
      sub-table. `<ul>`/`<li>`/`<br>` inside a `<td>` say what they are; a
      markdown cell can only run them together.
    - a **header column** as well as a header row (`<th scope="row">`).

    Emit a minimal, readable table: `<table>`, `<caption>`, `<thead>`/`<tbody>`
    where a header row exists, `<tr>`, `<th>`, `<td>`, and `rowspan`/`colspan`.
    Inline emphasis (`<strong>`, `<em>`, `<code>`, `<sup>`, `<sub>`), `<br>`, and
    list elements inside cells are fine. Nothing else — no classes, no styles, no
    ids, no `<div>`; those are the source's presentation, not its relation, and
    the reader strips them anyway.

    **The table's title is its `<caption>`, and it is not optional when the
    source shows one.** *(3.8)* A title drawn above a table — a rendered image's
    header line, a printed table number — is part of the table, so it goes
    inside the table: `<caption>Refrigerant System Capacities</caption>`,
    verbatim. Do NOT write it as a bold line above the table (it reads as prose
    and no consumer can tell it is the title), and do NOT write it as a
    `<!--segment structural-->` byte-mark: a byte-mark records structure the
    source *declares*, and a title rendered into pixels is interpreted from
    layout, not declared (spec §4.3.2.3, §4.3.2.4). Because markdown has no
    caption, **a titled table is always the HTML shape.**

    Where the same title also appears as a real heading element on the page that
    *embeds* this table, that page keeps its own byte-mark: it records that the
    page declares a heading, which is a different fact about different bytes
    (§4.3.2.4). Do not delete one because the other exists.

    **Empty cells stay empty** — `<td></td>`, or `` || `` in markdown, never
    `|—|`: an em-dash is a value the source did not write.

    Footnotes / table notes that sit *alongside* the table — a `*` note beneath
    it, a legend — go in a separate segment, not in the table cells and not in
    the caption.

    **Check your column count before you finish.** Every row, header included,
    carries the same number of cells once `colspan` is accounted for. A markdown
    table whose separator row has more pipes than its header is a silent defect
    that renders as a broken table and reads as data.

    **Graph-shaped sources.** A source may state its relation as a drawing
    rather than as a grid — a wiring schematic states a conductor set, a block
    diagram states a link set. Tracing a drawn connection is *transcription*:
    the tuple is on the page, read the same way a printed grid's cell is read.
    Transcribe such a region as a **from-to list** — one row per relation,
    carrying the source's own identifiers verbatim in the cells. For a wiring
    diagram that is: from component + cavity, to component + cavity, circuit
    number, colour, and any gauge/rating the drawing prints; an off-page
    reference (`Data Communication Schematics`) is a termination point like any
    other, named as printed. Where a label is unreadable, mark the cell
    `[unclear: <best guess>]` rather than dropping the row.

    Two boundaries hold. **Geometry is not relation content** — where a box
    sits on the page, and drawing chrome (navigation icons, sheet borders),
    stay with the sibling `image/figure` and its description; the table carries
    the relation only. And **a connection the drawing does not show is an
    inference**, which belongs to the ledger as a claim over this segment's
    span, never to a cell: transcribe the printed termination even when a
    downstream one is obvious. The figure and the from-to list stack at the
    same address (§4.3.2) and are jointly the complete rendering.
