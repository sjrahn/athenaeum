class_id: audio
kind: atomic
description: |
  Common guidance for audio-atom classifications. An audio-atom segment
  declares its specific classification on the opener line —
  `<!--segment audio/spoken-->`, `<!--segment audio/music-->`, etc. The
  bare `<!--segment audio-->` form is permitted for audio segments whose
  specific kind isn't (yet) declared.

  Audio-atom segments are positioning markers in document flow: their
  body must be empty. The asset's description lives on the matching embed.

  Audio-atom overlays never set `enables_lossless: true`. A lossless
  transcript of speech-bearing audio lives on a separate text-atom segment
  with a `text/transcript` overlay at the same `time_range=` address.
applies_to:
  atom: audio
enables_lossless: false
