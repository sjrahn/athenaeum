# athenaeum.yaml — the instance config (spec Part I §2.3). TRACKED.
#
# The instance is one private repository: this config, the corpus at corpus/,
# the ledger at ledger/. The tooling discovers it by walking up from the
# current directory ($ATHENAEUM_ROOT overrides).

name: my-athenaeum         # optional display name

# The tenancy floor: the fail-closed default for records whose origins declare
# no `tenancy:` (spec/ledger.md §6.4). Names `public`, `private`, or a tier
# declared below. Leave private unless you know better.
visibility: private

# Extra tenancy tiers beside the reserved `public`/`private` (spec/athenaeum.md
# §2.3, spec/ledger.md §6.4), and the named audiences the read surface serves.
# Absent block: the public|private binary — pre-tier behavior, byte-identical.
#tenancy:
#  tiers: [family, accountant]   # named tiers an origin overlay may declare
#                                # tenancy: under, or an audience may be granted
#  audiences:                   # audience name -> tiers granted. `public` is
#    family: [family]           # implicit in every audience; `private` is the
#    finances: [accountant]     # owner's alone, never grantable.

# The issue tracker — the instance's backlog. Reads go through `ath issue`;
# writes go through the forge's own CLI.
#tracker:
#  host: https://forge.example.com
#  repo: my-org/my-athenaeum
#  snapshot: corpus/runbooks/tickets.md   # where `ath issue sync` writes the
#                                         # committed offline read

# Reference datasets (spec/ledger.md §6.5) — locally-mirrored external
# databases cited as `ref://{dataset}/{id}` evidence (bare = the `latest` tag;
# `ref://{dataset}@{tag}/{id}` pins a snapshot). Each snapshot's mirror bytes
# are a corpus artifact — a terminal-contract record addressed by blake3.
# Register snapshots as they land, e.g.:
#   wikipedia:
#     description: English Wikipedia, ZIM mirrors
#     adapter: zim              # optional — derives from the mirror record's
#                               # mime overlay `ref_adapter` when omitted
#     latest: "2026-06"
#     snapshots:
#       "2026-06": { artifact: <64-hex blake3 of the ZIM's bytes> }
#
# The ledger's ontology layer (spec/ledger.md §15.2) extends into the
# registered spine — BFO-2020 and the CCO release, per the adoption rulings.
# Register both with `spine: true` once their release bytes are captured as
# ordinary mirror artifacts (an owner-gated capture, same as any reference) —
# fill in `latest:`/`snapshots:`/`artifact:` after capture:
#   bfo-2020:
#     description: BFO-2020 top-level ontology
#     adapter: bfo-2020
#     spine: true
#     latest: "<release tag>"
#     snapshots:
#       "<release tag>": { artifact: <64-hex blake3 of the BFO-2020 table set> }
#   cco-release:
#     description: Common Core Ontologies release
#     adapter: cco-release
#     spine: true
#     latest: "<release tag>"
#     snapshots:
#       "<release tag>": { artifact: <64-hex blake3 of the CCO release tree> }
references: {}

# Instance-registered tool assets (spec/athenaeum.md §2.3, spec/corpus.md
# §12.3.6) — engine payloads the tooling injects or executes, pinned exactly
# as reference snapshots are (captured with provenance, resolved through
# custody, updated by registration diff); same snapshot grammar as
# `references:`, none of the adapter/citation semantics. Register as
# captured, e.g.:
#   singlefile:
#     description: the SingleFile snapshot engine
#     latest: "<build tag>"
#     snapshots:
#       "<build tag>": { artifact: <64-hex blake3 of the registered build> }
assets: {}
