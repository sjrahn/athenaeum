[workspace]
resolver = "2"
members = ["crates/ath-core", "crates/ath-gui", "crates/ath-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
ath-core = { path = "crates/ath-core" }

serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
uuid = { version = "1", features = ["v4", "serde", "js"] }
chrono = { version = "0.4", features = ["serde"] }
petgraph = "0.7"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "8"
crossbeam-channel = "0.5"
eframe = { version = "0.34.1", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.34.1"
egui_extras = { version = "0.34.1", features = ["all_loaders"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
clap = { version = "4", features = ["derive", "env"] }
ehttp = "0.7"
serde_json = "1"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
rusqlite = { version = "0.34", features = ["bundled"] }
