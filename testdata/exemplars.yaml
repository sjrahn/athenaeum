# Exemplar library manifest for testdata/instance (see testdata/README.md).
#
# Each entry is a real artifact copied out of a private source instance, one per
# interesting mime/shape, for spec + tooling regression testing. `note` is
# neutral/technical only — no personal filenames, subjects, names, or content
# descriptions (this file is tracked in a publicly-hostable repo).
#
# Most entries are `direct`: the blake3 names a record whose bytes are
# reachable in the source instance (co-located artifacts/ tree) and are copied
# in as-is. A few small images exist in the source corpus only as *promoted
# container members* (an embedded <img> inside a captured HTML page) with no
# standalone bytes of their own — spec's containment model resolves them
# on-demand from their container, never materializing a separate copy. For
# those, `source: promoted` names the container (also copied in) and the
# member address `corpus promote` needs to re-mint the same (content-addressed,
# so byte-identical) leaf record inside testdata/instance.

