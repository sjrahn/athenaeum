# Exemplar library manifest — one artifact per mime (see testdata/README.md).
#
# Each entry names bytes the successor tooling (`ath/`) ingests, classifies to a root term of the
# regression ontology (testdata/ontology/) and lints clean; `ath/test/regression.test.ts` runs
# every entry whose bytes are present and `testdata/seed.ts` seeds them into testdata/instance.
# `note` is neutral/technical only — no personal filenames, subjects, names, or content
# descriptions (this file is tracked in a publicly-hostable repo).
#
# `source: regression` — private bytes placed by hand under testdata/regression/<file> (gitignored),
#   copied from the source instance's corpus (`ath-steven/corpus/artifacts/<ab>/<blake3>.*`) or its
#   export folder; the blake3 pins the exact bytes.
# `source: synthetic` — generated fixtures with no private content, committed under testdata/synthetic/
#   (see "The synthetic tier" in the README): the committed bytes, not a fresh run of a generator under synthetic/gen/, are what
#   the blake3 pins.
#
# `root` is the term `whole` manifests by the ontology's `matches` lines; `shape` is the exercise.

